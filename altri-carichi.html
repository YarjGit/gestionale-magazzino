<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altri Carichi – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="altri-carichi" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script>
  // Qui la controparte può essere sia un fornitore sia un cliente: due filtri separati
  avviaElenco({
    titolo: "Altri Carichi",
    nuovo: "Nuovo carico",
    csv: "altri-carichi",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    controparte: {
      filtri: [{ label: "Fornitore", tipo: "F" }, { label: "Cliente", tipo: "C" }],
      elenco: FORNITORI.map(nome => ({ nome, tipo: "F" })).concat(CLIENTI.map(nome => ({ nome, tipo: "C" })))
    },
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Fornitore / Cliente", 200),
      COL.data("bolla", "Bolla"),
      COL.testo("causale", "Causale", 160),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    // Come nel gestionale attuale, per ora nessun movimento
    dati: []
  });
</script>
</body>
</html>
