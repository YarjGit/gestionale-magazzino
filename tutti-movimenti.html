<script>
  // Riepilogo di tutti i tipi di movimento: qui non si crea nulla, si consulta.
  // Nel programma vero questi dati arriveranno dal database insieme a quelli delle singole pagine.
  const CONTROPARTI = FORNITORI.map(nome => ({ nome, tipo: "F" }))
    .concat(CLIENTI.map(nome => ({ nome, tipo: "C" })))
    .concat(SEDI_CP.map(s => ({ ...s, tipo: "S" })));
  const cp = nome => CONTROPARTI.findIndex(c => c.nome === nome);
  const vendite = (data, tot, nArt, id, prot) => ({
    id, prot, tipo: "Vendite Giornaliere", stato: "Definitivo", data, cp: null,
    causale: `Riepilogo vendite giornaliere del ${data.split("-").reverse().join("/")}`, totArt: tot, tot, nArt, lab: "Laboratori Sede Centrale"
  });

  avviaElenco({
    titolo: "Tutti i Movimenti",
    csv: "tutti-movimenti",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.riordino, STATO.evaso, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio", "Riordino"],
    controparte: {
      filtri: [{ label: "Fornitore", tipo: "F" }, { label: "Cliente", tipo: "C" }],
      elenco: CONTROPARTI
    },
    filtriExtra: [{ id: "fTipo", label: "Tipo movimento", campo: "tipo", opzioni: Object.keys(TIPI_MOVIMENTO) }],
    azioniRiga: ["Apri nella sua pagina", "Stampa documento", "Stampa etichette"],
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.tipo(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Fornitore / Cliente", 160),
      COL.testo("causale", "Causale", 110),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: [
      vendite("2026-10-21", 308.8, 7, 8822, "2026-000247"),
      vendite("2026-10-20", 211.5, 11, 8820, "2026-000246"),
      { id: 8819, prot: "2026-000183", tag: { testo: "da inevasi", colore: "#7c4dff" }, tipo: "Ordine a Fornitore", stato: "Riordino", data: "2026-10-20", cp: cp("Tessuti Liturgici Esempio SRL"), causale: "Ordine creato con gli articoli non evasi", tot: 120.53, nArt: 5, lab: "Laboratori Sede Centrale" },
      { id: 8816, doc: "n.247", dataDoc: "2026-10-14", tipo: "Carico da Fornitore", stato: "Annullato", data: "2026-10-19", cp: cp("Arredi Sacri Esempio SNC"), causale: "", tot: 0, nArt: 0, lab: "Laboratorio Ceramiche" },
      { id: 8815, doc: "n.247", dataDoc: "2026-10-14", tipo: "Carico da Fornitore", stato: "Definitivo", data: "2026-10-19", cp: cp("Arredi Sacri Esempio SNC"), causale: "", tot: 986.55, nArt: 33, lab: "Laboratori Sede Centrale" },
      { id: 8814, doc: "n.774", dataDoc: "2026-10-16", tipo: "Carico da Fornitore", stato: "Definitivo", data: "2026-10-19", cp: cp("Tessuti Liturgici Esempio SRL"), causale: "", tot: 770.67, nArt: 36, lab: "Laboratorio Confezione Sede Centrale" },
      vendite("2026-10-19", 1655.6, 32, 8812, "2026-000245"),
      { id: 8811, prot: "2026-000245", tipo: "Trasferimento a Filiale", stato: "Provvisorio", data: "2026-10-20", cp: cp("CAL Bari"), causale: "Riassortimento Natale", tot: 1240.5, nArt: 48, lab: "Laboratori Sede Centrale" },
      vendite("2026-10-17", 270.5, 8, 8809, "2026-000244"),
