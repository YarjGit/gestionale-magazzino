<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorie – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  /* Categorie come schede invece che come tabella */
  .griglia {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .cat {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .cat:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,30,50,0.08); border-color: #c9d6ea; }
  .lettera {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: grid; place-items: center;
    color: #fff;
    font: 700 1.3rem "JetBrains Mono", monospace;
  }
  .cat-testo { min-width: 0; flex: 1; }
  .cat-nome { font-weight: 700; text-transform: uppercase; font-size: 0.88rem; }
  .cat-info { margin-top: 4px; color: var(--muted); font-size: 0.8rem; }
  .cat .icon-btn { position: absolute; top: 8px; right: 6px; }
  .cat-freccia { color: #b7c0cf; }
</style>
</head>
<body data-page="categorie">

<template id="top-actions">
  <label class="top-toggle" title="Funzione da definire">
    <input type="checkbox" id="recordAttuali" checked> Record attuali
  </label>
  <span class="spacer"></span>
  <button class="btn btn-primary" id="btnCrea">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nuova categoria
  </button>
</template>

<main class="content">
  <div class="page-head">
    <div>
      <h1 class="page-title">Categorie</h1>
      <div class="crumbs">
        <a href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
        <span>-</span><span>Magazzino</span><span>-</span><span>Categorie</span>
      </div>
    </div>
  </div>

  <section class="panel">
    <div class="toolbar">
      <div class="tool-group">
        <button title="Aggiorna" id="aggiorna"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button title="Esporta in Excel (CSV)" id="esporta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l6 6M15 13l-6 6"/></svg></button>
      </div>
      <span id="conteggio" style="color:var(--muted)"></span>
      <div class="cerca">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cerca" type="search" placeholder="Cerca codice o descrizione…">
      </div>
    </div>
    <div class="griglia" id="griglia"></div>
  </section>
</main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/categorie.js"></script>
<script>
  const $ = id => document.getElementById(id);

  function disegna() {
    const q = $("cerca").value.trim().toLowerCase();
    const lista = CATEGORIE.filter(c => !q || (c.cod + " " + c.descr).toLowerCase().includes(q))
      .sort((a, b) => a.cod.localeCompare(b.cod));
    $("conteggio").textContent = `${lista.length} categorie`;
    $("griglia").innerHTML = lista.length ? lista.map(c => {
      const nSotto = SOTTOCATEGORIE.filter(s => s.cat === c.cod).length;
      return `<div class="cat" data-cod="${c.cod}" title="Apri le sottocategorie di ${c.descr}">
        <div class="lettera" style="background:${c.colore}">${c.cod}</div>
        <div class="cat-testo">
          <div class="cat-nome">${c.descr}</div>
          <div class="cat-info">${nSotto} sottocategorie · ${ARTICOLI_PER_CATEGORIA[c.cod] || 0} articoli</div>
        </div>
        <button class="icon-btn" title="Modifica" data-az="modifica"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
      </div>`;
    }).join("") : '<div class="vuoto" style="grid-column:1/-1"><b>Nessuna categoria trovata</b></div>';
  }

  $("griglia").onclick = e => {
    const card = e.target.closest(".cat");
    if (!card) return;
    if (e.target.closest("[data-az]")) { avviso(`Modifica categoria ${card.dataset.cod}: da costruire`); return; }
    location.href = `sottocategorie.html?cat=${card.dataset.cod}`;
  };
  $("cerca").oninput = disegna;
  $("aggiorna").onclick = () => { disegna(); avviso("Elenco aggiornato"); };
  $("btnCrea").onclick = () => avviso("Nuova categoria: schermata da costruire");
  $("recordAttuali").onchange = () => avviso("Funzione da definire insieme");
  $("esporta").onclick = () => {
    const csv = [["Codice", "Descrizione", "Sottocategorie", "Articoli"]]
      .concat(CATEGORIE.map(c => [c.cod, c.descr, SOTTOCATEGORIE.filter(s => s.cat === c.cod).length, ARTICOLI_PER_CATEGORIA[c.cod] || 0]))
      .map(r => r.map(v => `"${v}"`).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "categorie.csv";
    a.click();
  };

  disegna();
</script>
</body>
</html>
