<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #bff3f5;
    --bg-mid: #6fd6e0;
    --bg-deep: #0d4b5c;
    --glow: #7ff6ff;
    --accent: #1f8fff;
    --accent-dark: #1570d6;
    --card: rgba(255, 255, 255, 0.28);
    --card-border: rgba(255, 255, 255, 0.65);
    --text: #0b2a36;
    --muted: #2f5866;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg-deep);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* ---------- Sfondo ---------- */
  .scene {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(255,255,255,0.85) 0%, rgba(191,243,245,0.55) 22%, transparent 55%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-deep) 100%);
    z-index: -3;
  }

  /* Pavimento a griglia in prospettiva */
  .floor {
    position: fixed;
    left: -50%;
    right: -50%;
    bottom: -10%;
    height: 60%;
    background-image:
      linear-gradient(rgba(127,246,255,0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,246,255,0.55) 1px, transparent 1px);
    background-size: 70px 70px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: center top;
    mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 100%);
    animation: scorri 6s linear infinite;
    z-index: -2;
  }

  @keyframes scorri {
    from { background-position: 0 0; }
    to   { background-position: 0 70px; }
  }

  /* Scaffali stilizzati (al posto dei server) */
  .racks {
    position: fixed;
    bottom: 6%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 6vw;
    z-index: -1;
    pointer-events: none;
  }

  .rack {
    width: 14vw;
    max-width: 200px;
    min-width: 70px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border: 1px solid rgba(127,246,255,0.6);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(13,75,92,0.35), rgba(13,75,92,0.65));
    box-shadow: 0 0 40px rgba(127,246,255,0.35), inset 0 0 20px rgba(127,246,255,0.15);
    opacity: 0.85;
  }

  .rack.big { width: 20vw; max-width: 280px; }

  .shelf {
    height: 26px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    border-bottom: 2px solid rgba(127,246,255,0.8);
    display: flex;
    gap: 4px;
    padding: 4px;
  }

  .box {
    flex: 1;
    border-radius: 2px;
    background: rgba(255, 214, 150, 0.55);
  }
  .box.e { background: transparent; }

  .light {
    position: fixed;
    width: 2px;
    height: 140px;
    background: linear-gradient(180deg, transparent, var(--glow), transparent);
    opacity: 0.7;
    animation: cade linear infinite;
    z-index: -1;
  }

  @keyframes cade {
    from { transform: translateY(-160px); }
    to   { transform: translateY(110vh); }
  }

  /* ---------- Card di accesso ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 34px 32px 28px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 20px 60px rgba(8, 50, 64, 0.35), 0 0 0 6px rgba(255,255,255,0.08);
    text-align: center;
    animation: entra 0.6s ease-out;
  }

  @keyframes entra {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), #27c4d8);
    box-shadow: 0 8px 24px rgba(31,143,255,0.45);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .sub {
    margin-top: 6px;
    font-size: 0.92rem;
    color: var(--muted);
  }

  .btn-google {
    margin-top: 26px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 13px 18px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #1f2d33;
    font: 600 0.98rem "Inter", sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(8,50,64,0.18);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-google:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(8,50,64,0.25);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 16px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(11,42,54,0.2);
  }

  label {
    display: block;
    text-align: left;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid rgba(11,42,54,0.18);
    background: rgba(255,255,255,0.85);
    font: 500 0.95rem "Inter", sans-serif;
    color: var(--text);
  }

  .btn-accedi {
    margin-top: 18px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    font: 600 0.98rem "Inter", sans-serif;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(31,143,255,0.4);
    transition: filter 0.15s;
  }
  .btn-accedi:hover { filter: brightness(1.08); }

  .hint {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .footer {
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .card { padding: 28px 20px 22px; }
    .racks { bottom: 8%; }
  }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="floor"></div>
  <div class="racks" aria-hidden="true" id="racks"></div>

  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
        <path d="M7 20v-7h10v7"/>
        <path d="M7 16h10"/>
      </svg>
    </div>
    <h1>Gestionale Magazzino</h1>
    <p class="sub">Accedi per gestire giacenze, carichi e trasferimenti</p>

    <button class="btn-google" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      Accedi con Google
    </button>

    <p class="hint">Dopo l'accesso sceglierai la sede da cui lavori</p>

    <p class="footer">© 2026 Gestionale Magazzino · Accesso riservato al personale</p>
  </main>

<script>
  // Scaffali decorativi sullo sfondo
  const racks = document.getElementById("racks");
  [{ big: false, n: 5 }, { big: true, n: 7 }, { big: false, n: 5 }].forEach(cfg => {
    const r = document.createElement("div");
    r.className = "rack" + (cfg.big ? " big" : "");
    for (let i = 0; i < cfg.n; i++) {
      const s = document.createElement("div");
      s.className = "shelf";
      for (let j = 0; j < 4; j++) {
        const b = document.createElement("div");
        b.className = "box" + (Math.random() < 0.3 ? " e" : "");
        s.appendChild(b);
      }
      r.appendChild(s);
    }
    racks.appendChild(r);
  });

  // Scie luminose che scendono
  for (let i = 0; i < 14; i++) {
    const l = document.createElement("div");
    l.className = "light";
    l.style.left = Math.random() * 100 + "vw";
    l.style.animationDuration = 3 + Math.random() * 4 + "s";
    l.style.animationDelay = -Math.random() * 6 + "s";
    document.body.appendChild(l);
  }

  // Accesso (per ora simulato): login uguale per tutti, la sede si sceglie dopo
  document.querySelector(".btn-google").addEventListener("click", () => {
    try { sessionStorage.removeItem("sede"); } catch (e) {}
    location.href = "dashboard.html";
  });
</script>
</body>
</html>
