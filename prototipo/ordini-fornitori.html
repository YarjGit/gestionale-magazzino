<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordini a Fornitori – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="ordini-fornitori" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-ordini.js"></script>
<script>
  avviaElenco({
    titolo: "Ordini a Fornitori",
    nuovo: "Nuovo ordine",
    dettaglio: "ordine.html",
    csv: "ordini-fornitori",
    stati: [STATO.provvisorio, STATO.definitivo, STATO.riordino, STATO.evaso, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio", "Riordino"],
    controparte: { filtro: "Fornitore", elenco: FORNITORI },
    azioniRiga: ["Modifica", "Invia al fornitore", "Carica merce arrivata", "Stampa documento", "Duplica"],
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Fornitore", 190),
      COL.testo("causale", "Causale", 150),
      COL.avanzamento("ricevuti", "Arrivato", "nArt"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: ORDINI
  });
</script>
</body>
</html>
