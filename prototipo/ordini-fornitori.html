<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordini a Fornitori – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="ordini-fornitori" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script src="js/dati-ordini.js"></script>
<script>
  const elenco = avviaElenco({
    titolo: "Ordini a Fornitori",
    nuovo: "Nuovo ordine",
    dettaglio: "ordine.html",
    csv: "ordini-fornitori",
    stati: [STATO.provvisorio, STATO.definitivo, STATO.riordino, STATO.evaso, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio", "Riordino"],
    controparte: { filtro: "Fornitore", elenco: FORNITORI },
    azioniRiga: ["Modifica", "Invia al fornitore", "Carica merce arrivata", "Stampa documento", "Duplica"],
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Fornitore", 190),
      COL.testo("causale", "Causale", 150),
      COL.avanzamento("ricevuti", "Arrivato", "nArt"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: ORDINI
  });

  // Dopo l'accesso: gli ordini salvati nel database della sede di lavoro, in cima a quelli di esempio
  dbPronto.then(async db => {
    if (!db) return;
    const sedeId = ID_SEDI_DB[trovaSede(leggiSede()).nome];
    // Tasto INEVASI in alto: quello che questa sede ha ordinato a un'altra sede (es. Magazzino Centrale) e non è ancora arrivato
    const attesa = await inevasiDb(db, { sede_richiedente: sedeId });
    const nArt = new Set(attesa.map(r => r.articolo_id)).size;
    if (sedeId !== "magazzino-centrale" || nArt) {
      document.querySelector(".top-actions .spacer").insertAdjacentHTML("afterend", `
        <a href="inevasi.html?vista=attesa" class="btn-inevasi-top${nArt ? "" : " zero"}" title="Articoli ordinati e non ancora arrivati: non vanno riordinati">⏳ INEVASI IN ATTESA <span class="num">${nArt}</span></a>
        <span class="spacer"></span>`);
    }
    const righe = await elencoMovimentiDb(db, "ordine_fornitore", sedeId, "ordine.html");
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
