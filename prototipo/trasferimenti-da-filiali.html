<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trasferimenti da Filiali – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  .da-ricevere { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; padding: 14px 16px; border: 2px solid #67c7dc; border-radius: 12px; background: #ecfaff; }
  .da-ricevere a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: #fff; color: var(--text); text-decoration: none; font-weight: 500; }
  .da-ricevere a:hover { background: #eef5ff; }
  .da-ricevere a span { margin-left: auto; padding: 4px 12px; border-radius: 7px; background: #0891b2; color: #fff; font-weight: 600; font-size: 0.82rem; }
  /* Scheda "In attesa": staccata dalle altre e viola, perché mostra prodotti e non trasferimenti */
  .tab-attesa { margin-left: 10px; padding: 9px 14px; border: 2px solid #c7b4f5; border-radius: 10px; background: #f6f1ff; color: #5b2fc0; box-shadow: 0 2px 8px rgba(20,30,50,0.05); }
  .tab-attesa .n { background: #e6dbff; color: #5b2fc0; }
  .tab-attesa.active { background: #7c4dff; border-color: #7c4dff; color: #fff; }
  .tab-attesa.active .n { background: rgba(255,255,255,0.25); color: #fff; }
  .titolo-attesa { font-size: 1rem; color: #5b2fc0; margin-bottom: 4px; }
  .sotto-attesa { color: var(--muted); font-size: 0.86rem; margin-bottom: 12px; }
  .riepilogo-attesa { margin-top: 12px; color: var(--muted); }
  .riepilogo-attesa b { color: var(--text); }
  main.content > section.panel[hidden] { display: none; }
</style>
</head>
<body data-page="trasferimenti-da-filiali" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Gli arrivi compaiono da soli: quando una sede fa un "Trasferimento a filiale" verso questa sede, il movimento
  // compare qui "Da ricevere". Si apre, si stampano le etichette e si conferma: solo allora la giacenza aumenta.
  // Qui non si crea niente a mano (niente "Nuovo").
  const elenco = avviaElenco({
    titolo: "Trasferimenti da Filiali",
    nota: "🔄 <b>Arrivano in automatico.</b> Quando un'altra sede manda la merce qui (Trasferimento a filiale), il movimento compare in questo elenco come <b>Da ricevere</b>. Aprilo, controlla gli articoli, stampa le etichette e premi <b>Conferma ricevuto</b>: solo allora la merce entra nella giacenza di questa sede.",
    dettaglio: "trasferimento.html",
    csv: "trasferimenti-da-filiali",
    stati: [STATO.daRicevere, STATO.ricevuto, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Da ricevere"],
    senzaModifica: true,
    controparte: { filtro: "Sede di provenienza", elenco: SEDI_CP },
    azioniRiga: ["Vedi articoli", "Stampa etichette", "Stampa documento"],
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Da sede", 200),
      COL.data("bolla", "Bolla"),
      COL.testo("causale", "Causale", 130),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });

  // Dopo l'accesso: i trasferimenti arrivati da altre sedi (salvati nel database)
  dbPronto.then(async db => {
    if (!db) return;
    const sedeId = ID_SEDI_DB[trovaSede(leggiSede()).nome];
    const righe = await elencoMovimentiDb(db, "trasferimento_a_filiale", sedeId, "trasferimento.html", { inArrivo: true });
    if (righe.length) elenco.aggiungi(righe);
    // Merce in arrivo da confermare: in cima, ben visibile
    const arrivi = await trasferimentiDaRicevereDb(db, sedeId);
    if (arrivi.length) document.querySelector(".page-head").insertAdjacentHTML("afterend", `
      <div class="da-ricevere">
        <b>📦 Merce in arrivo da confermare: ${arrivi.length}</b>
        ${arrivi.map(a => `<a href="trasferimento.html?db=${a.id}">${esc(a.da)} · trasferimento #${a.id} del ${dataIt(a.data)} · ${a.articoli} articoli, ${a.pezzi} pezzi <span>Apri e conferma →</span></a>`).join("")}
      </div>`);
    await ordiniAlleSedi(db, sedeId);
    await schedaInAttesa(db, sedeId);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));

  // ---------- Riquadro "Ordini al Magazzino": gli ordini fatti da questa sede a un'altra sede (es. SMM → Magazzino Centrale) ----------
  // Compaiono da soli appena l'ordine è inviato (Definitivo), come gli ordini a fornitori in Carichi da Fornitori.
  // La merce la manda l'altra sede con un trasferimento: quando è partito, il tasto diventa "Ricevi" e apre quel trasferimento.
  async function ordiniAlleSedi(db, sedeId) {
    const righe = await inevasiDb(db, { sede_richiedente: sedeId });
    if (!righe.length) return;
    const ordini = new Map();
    righe.forEach(r => {
      const o = ordini.get(r.ordine_id) || { id: r.ordine_id, prot: r.protocollo, data: r.data_ordine, stato: r.stato_ordine, sede: r.sede_fornitrice, righe: [], pezzi: 0 };
      o.righe.push(r.ordine_riga_id); o.pezzi += r.residuo;
      ordini.set(r.ordine_id, o);
    });
    // Trasferimenti già partiti per questi ordini e non ancora confermati: si riconoscono dalle righe collegate all'ordine
    const { data: partiti } = await db.from("movimenti_righe").select("ordine_riga_id, movimenti(id, tipo, stato, ricevuto_il)")
      .in("ordine_riga_id", righe.map(r => r.ordine_riga_id));
    const daRicevere = new Map();
    (partiti || []).filter(p => p.movimenti && p.movimenti.tipo === "trasferimento_a_filiale" && ["Definitivo", "Evaso"].includes(p.movimenti.stato) && !p.movimenti.ricevuto_il)
      .forEach(p => ordini.forEach(o => { if (o.righe.includes(p.ordine_riga_id)) daRicevere.set(o.id, p.movimenti.id); }));
    for (const o of ordini.values()) o.nomeSede = await nomeSedeDb(db, o.sede);
    document.querySelector(".page-head").insertAdjacentHTML("afterend", `
      <details class="ordini-da-caricare" open>
        <summary>📦 Ordini alle sedi in attesa: ${ordini.size}<small>quando la merce parte, premi Ricevi</small></summary>
        <div class="lista">${[...ordini.values()].reverse().map(o => {
          const tr = daRicevere.get(o.id);
          const nota = tr ? "merce partita, da ricevere" : o.stato === "Evaso" ? "mandato in parte, il resto è in attesa" : "ordine inviato, da preparare";
          return `<a href="${tr ? `trasferimento.html?db=${tr}` : `ordine.html?db=${o.id}`}" title="${tr ? "Apri il trasferimento e conferma il ricevuto" : "Vedi l'ordine"}">
            <div class="t"><b>${esc(o.nomeSede)}</b><small>Ordine ${esc(o.prot || "#" + o.id)} del ${dataIt(o.data)} · ${o.righe.length} articoli, ${(Math.round(o.pezzi * 100) / 100).toLocaleString("it-IT")} pezzi · ${nota}</small></div>
            <span class="vai"${tr ? "" : ' style="background:#eef1f6;color:var(--text)"'}>${tr ? "Ricevi →" : "Vedi ordine →"}</span></a>`;
        }).join("")}</div>
      </details>`);
  }

  // ---------- Scheda "⏳ In attesa": prodotti ordinati ad altre sedi e non ancora partiti (inevasi) ----------
  // Non è un filtro dei trasferimenti come le altre schede: per questo è staccata e viola, e mostra un'altra tabella.
  async function schedaInAttesa(db, sedeId) {
    const lista = await inevasiDb(db, { sede_richiedente: sedeId });
    for (const r of lista) r.nomeFornitrice = await nomeSedeDb(db, r.sede_fornitrice);
    const nArticoli = new Set(lista.map(r => r.articolo_id)).size;
    document.getElementById("tabs").insertAdjacentHTML("afterend",
      `<button class="tab tab-attesa" id="tabAttesa" title="Prodotti ordinati e non ancora partiti">⏳ In attesa<span class="n">${nArticoli}</span></button>`);
    document.querySelector("main.content > section.panel").insertAdjacentHTML("beforebegin", `<section class="panel" id="pannelloAttesa" hidden>
      <h2 class="titolo-attesa">⏳ Prodotti ordinati e non ancora arrivati</h2>
      <p class="sotto-attesa">Sono gli <b>inevasi</b>: ordinati ad un'altra sede e non ancora spediti. Si aggiornano da soli quando la merce parte e confermi il ricevuto.</p>
      ${lista.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Articolo</th><th>Da quale sede</th><th>Ordine</th><th class="num">Ordinata</th><th class="num">Già arrivata</th><th class="num">Ancora in attesa</th><th>Stato</th></tr></thead>
        <tbody>${lista.map(r => `<tr>
          <td class="art-cella"><span class="codice">${esc(r.articolo.codice)}</span> ${esc(r.articolo.descr)}</td>
          <td>${esc(r.nomeFornitrice)}</td>
          <td><a class="num-mov" href="ordine.html?db=${r.ordine_id}"><span class="id">#${r.ordine_id}</span></a> <small style="color:var(--muted)">${dataIt(r.data_ordine)}</small></td>
          <td class="num">${r.ordinata}</td><td class="num">${r.trasferita}</td>
          <td class="num"><b style="color:#7c4dff">${r.residuo}</b></td>
          <td><small>${r.stato_ordine === "Definitivo" ? "ordine non ancora preparato" : "in attesa della merce"}</small></td>
        </tr>`).join("")}</tbody></table></div>
        <div class="riepilogo-attesa">Articoli: <b>${nArticoli}</b> · Pezzi in attesa: <b>${Math.round(lista.reduce((s, r) => s + r.residuo, 0) * 100) / 100}</b></div>`
      : '<div class="vuoto"><b>Niente in attesa</b><span>Tutto quello che avete ordinato alle altre sedi è già partito.</span></div>'}
    </section>`);
    // Apri / chiudi: la scheda nasconde l'elenco dei trasferimenti; le altre schede lo rimettono
    const mostra = si => {
      document.getElementById("tabAttesa").classList.toggle("active", si);
      document.getElementById("pannelloAttesa").hidden = !si;
      document.querySelectorAll("main.content > section.panel:not(#pannelloAttesa)").forEach(s => s.hidden = si);
      if (si) document.querySelectorAll("#tabs .tab").forEach(t => t.classList.remove("active"));
    };
    document.getElementById("tabAttesa").onclick = () => mostra(true);
    document.getElementById("tabs").addEventListener("click", () => mostra(false), true);
  }
</script>
</body>
</html>
