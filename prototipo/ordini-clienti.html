<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Ordini da Clienti – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="ordini-clienti" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js?v=20261126b"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js?v=20261126b"></script>
<script>
  // Ordini da clienti: un clic apre la scheda (ordine-cliente.html), da cui si stampa il DDT intestato al cliente
  const elenco = avviaElenco({
    titolo: "Ordini da Clienti",
    nuovo: "Nuovo ordine cliente",
    dettaglio: "ordine-cliente.html",
    csv: "ordini-clienti",
    stati: [STATO.provvisorio, STATO.definitivo, STATO.evaso, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    controparte: { filtro: "Cliente", elenco: CLIENTI },
    azioniRiga: ["Apri", "Stampa DDT"],
    azione: (az, r) => { if (!r.url) return false; location.href = az === "Stampa DDT" ? r.url + "&ddt=1" : r.url; },
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("doc", "N. bolla", 90),
      COL.controparte("Cliente", 240),
      COL.testo("causale", "Causale", 160),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });

  // Dopo l'accesso: gli ordini da clienti salvati nel database della sede di lavoro
  dbPronto.then(async db => {
    if (!db) return;
    const sede = ID_SEDI_DB[trovaSede(leggiSede()).nome];
    const righe = await elencoMovimentiDb(db, "ordine_cliente", sede, "ordine-cliente.html");
    if (righe.length) elenco.aggiungi(righe);

    // Magazzino Centrale (o ogni sede che fa da fornitore alle altre): anche gli ordini ricevuti dalle filiali.
    // Nel gestionale attuale finiscono mescolati agli ordini dei clienti, con i "Riordino" degli inevasi che si ripetono
    // (n.inevasi-inevasi-…): qui ogni ordine compare una volta sola, con quello che resta da mandare.
    const [daPreparare, inevasi] = await Promise.all([
      inevasiDb(db, { sede_fornitrice: sede, stato_ordine: "Definitivo" }, { soloResiduo: false }),
      inevasiDb(db, { sede_fornitrice: sede, stato_ordine: "Evaso" })
    ]);
    const ordini = new Map();
    daPreparare.forEach(r => {
      const o = ordini.get(r.ordine_id) || { id: r.ordine_id, prot: r.protocollo || "#" + r.ordine_id, da: r.nomeRichiedente, data: r.data_ordine, righe: 0, pezzi: 0 };
      o.righe++; o.pezzi += r.ordinata;
      ordini.set(r.ordine_id, o);
    });
    const lista = [...ordini.values()].reverse();
    const nOrdInev = new Set(inevasi.map(r => r.ordine_id)).size;
    const pezziInev = inevasi.reduce((s, r) => s + r.residuo, 0);
    if (!lista.length && !nOrdInev) return;
    document.querySelector(".page-head").insertAdjacentHTML("afterend", `
      <details class="ordini-da-caricare" open>
        <summary>🏬 Ordini ricevuti dalle filiali: ${lista.length}<small>si preparano con un trasferimento a filiale: quello che manca resta negli inevasi</small></summary>
        <div class="lista">${lista.map(o => `<a href="trasferimento.html?nuovo=1&ordine=${o.id}" title="Prepara il trasferimento con gli articoli di questo ordine">
            <div class="t"><b>${esc(o.da)}</b><small>Ordine ${esc(o.prot)} del ${dataIt(o.data)} · ${o.righe} articoli, ${o.pezzi.toLocaleString("it-IT")} pezzi</small></div>
            <span class="vai">Prepara trasferimento →</span></a>`).join("")}
          ${nOrdInev ? `<a href="inevasi.html" title="Articoli ordinati dalle filiali e non ancora mandati">
            <div class="t"><b>⏳ Inevasi in attesa</b><small>${nOrdInev} ordini con ${pezziInev.toLocaleString("it-IT")} pezzi ancora da mandare (ognuno una volta sola)</small></div>
            <span class="vai">Vedi inevasi →</span></a>` : ""}</div>
      </details>`);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
