<script>
  // Rettifica in diminuzione: nessun cliente né fornitore, la causale spiega il motivo
  avviaElenco({
    titolo: "Diminuzione Giacenza",
    nuovo: "Nuova diminuzione",
    csv: "diminuzione-giacenza",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("causale", "Causale", 300),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });
