<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Diminuzione Giacenza – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="diminuzione-giacenza" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js?v=20261126b"></script>
<script src="js/elenco.js?v=20261126b"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js?v=20261127"></script>
<script>
  // Rettifica in diminuzione: nessun cliente né fornitore. Merce rotta, mancante all'inventario, smarrita, uso interno.
  const elenco = avviaElenco({
    titolo: "Diminuzione Giacenza",
    nuovo: "Nuova diminuzione",
    nota: "➖ Per la merce che esce <b>senza essere venduta né trasferita</b>: rotta, mancante all'inventario, smarrita, usata internamente. Quando è <b>definitiva</b> la merce esce dalla giacenza di questa sede (dal lotto più vecchio).",
    dettaglio: "diminuzione.html",
    senzaEtichette: true,   // niente tasto Etichette in alto (chiesto dall'utente)
    csv: "diminuzione-giacenza",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("causale", "Causale", 300),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });

  // Dopo l'accesso: le diminuzioni salvate nel database
  dbPronto.then(async db => {
    if (!db) return;
    const righe = await elencoMovimentiDb(db, "diminuzione_giacenza", ID_SEDI_DB[trovaSede(leggiSede()).nome], "diminuzione.html");
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
