<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutti i Movimenti – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="tutti-movimenti" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Riepilogo di tutti i tipi di movimento della sede, come "Tutti i Movimenti" del gestionale attuale:
  // qui non si crea nulla, si consulta; un clic sulla riga apre il movimento nella sua scheda.
  // Colonne come nel gestionale attuale: numero, tipo, stato, data documento, cliente/fornitore, data bolla, causale,
  // totale articoli, totale complessivo (con le spese), numero articoli.
  const CONTROPARTI = FORNITORI.map(nome => ({ nome, tipo: "F" }))
    .concat(CLIENTI.map(nome => ({ nome, tipo: "C" })))
    .concat(SEDI_CP.map(s => ({ ...s, tipo: "S" })));
  const elenco = avviaElenco({
    titolo: "Tutti i Movimenti",
    csv: "tutti-movimenti",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.riordino, STATO.evaso, STATO.daRicevere, STATO.ricevuto, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio", "Riordino"],
    controparte: {
      filtri: [{ label: "Fornitore", tipo: "F" }, { label: "Cliente", tipo: "C" }],
      elenco: CONTROPARTI
    },
    filtriExtra: [{ id: "fTipo", label: "Tipo movimento", campo: "tipo", opzioni: Object.keys(TIPI_MOVIMENTO) }],
    azioniRiga: ["Apri nella sua pagina", "Stampa documento", "Stampa etichette"],
    colonne: [
      COL.numero("Data / Numero"),
      COL.tipo("Tipo di movimento"),
      COL.stato(),
      COL.data("data", "Data documento"),
      COL.controparte("Cliente / Fornitore", 200),
      COL.data("bolla", "Data bolla"),
      COL.testo("causale", "Causale", 180),
      COL.euro("totArt", "Totale articoli"),
      COL.euro("tot", "Totale compless.", true),
      COL.intero("nArt", "Numero articoli")
    ],
    dati: []
  });

  // Dopo l'accesso: tutti i movimenti della sede salvati nel database
  dbPronto.then(async db => {
    if (!db) return;
    const righe = await elencoTuttiMovimentiDb(db, ID_SEDI_DB[trovaSede(leggiSede()).nome]);
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
