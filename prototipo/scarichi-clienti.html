<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarichi a Clienti – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="scarichi-clienti" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Il cliente può essere anche una sede interna (es. Magazzino Centrale)
  const CLIENTI_E_SEDI = CLIENTI.concat(SEDI_CP);
  const cli = nome => CLIENTI_E_SEDI.findIndex(c => (c.nome || c) === nome);

  const elenco = avviaElenco({
    titolo: "Scarichi a Clienti",
    nuovo: "Nuovo scarico",
    csv: "scarichi-clienti",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    controparte: { filtro: "Cliente", elenco: CLIENTI_E_SEDI },
    // "Nuovo scarico" = merce spedita a un cliente senza ordine: stessa scheda dell'ordine da cliente (ordine-cliente.html?tipo=scarico)
    nuovoUrl: "ordine-cliente.html?nuovo=1&tipo=scarico",
    azioniRiga: ["Apri", "Stampa DDT", "Apri l'ordine d'origine"],
    azione: (az, r) => {
      if (az === "Apri l'ordine d'origine") { if (r.ordine) location.href = `ordine-cliente.html?db=${r.ordine}`; else avviso("Questo scarico non è nato da un ordine"); return; }
      if (!r.url) return false;
      location.href = az === "Stampa DDT" ? r.url + "&ddt=1" : r.url;
    },
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("doc", "N. bolla", 90),
      COL.controparte("Cliente", 240),
      COL.data("bolla", "Data bolla"),
      COL.testo("causale", "Causale", 160),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });

  // Dopo l'accesso: gli scarichi salvati nel database. Nascono dagli ordini da clienti (Sì a "Vuoi scalare la merce
  // dalla giacenza?") o da "Nuovo scarico"; un clic apre lo scarico, che porta all'ordine d'origine se c'è
  dbPronto.then(async db => {
    if (!db) return;
    const righe = await elencoMovimentiDb(db, "scarico_cliente", ID_SEDI_DB[trovaSede(leggiSede()).nome], "ordine-cliente.html");
    righe.forEach(r => { const n = /ordine da cliente #(\d+)/i.exec(r.causale || ""); r.ordine = n ? +n[1] : 0; });
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
