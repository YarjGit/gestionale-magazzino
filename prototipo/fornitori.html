<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Fornitori – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="fornitori" data-top="anagrafica">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/anagrafica.js"></script>
<script>
  // Dati inventati per il prototipo
  const dati = [
    ["Bottega Artigiana Esempio Studio Pittorico", "02126900000", "", "000704", ""],
    ["Arredi Sacri Esempio SNC", "00901010000", "", "900012", "Magazzino Centrale"],
    ["Proart Esempio snc", "02712050000", "02712050000", "914", ""],
    ["Import Esempio SRL", "01287650000", "", "000200", ""],
    ["Diffusione Esempio S.R.L.", "02904890000", "", "000148", ""],
    ["Oreficeria Sacra Esempio", "00739380000", "", "000542", ""],
    ["Tessuti Liturgici Esempio SRL", "02571930000", "", "000354", ""],
    ["Office Superstore Esempio", "04269720000", "", "002226", ""],
    ["Fornitori vari", "", "", "000999", ""],
    ["Ferramenta Esempio SAS", "01709370000", "", "007032", ""],
    ["Ceramiche Artistiche Esempio", "03312450000", "", "000811", "Laboratorio Ceramiche"],
    ["Ricami d'Arte Esempio SRLS", "05544320000", "", "001102", "Laboratorio Confezione Sede Centrale"]
  ].map(([nome, piva, cf, cod, sede]) => ({ nome: nome.toUpperCase(), piva, cf, cod, sede }));

  const pagina = avviaAnagrafica({
    titolo: "Fornitori",
    sezione: "Configurazione",
    dalDatabase: true,
    nuovo: "Nuovo fornitore",
    nuovoUrl: "fornitore.html?nuovo=1",
    scheda: r => r.cod ? `fornitore.html?cod=${encodeURIComponent(r.cod)}` : null,
    csv: "fornitori",
    chiave: "nome",
    tabs: [
      { k: "piva", t: "Con P.IVA", colore: "#18a058", f: r => !!r.piva },
      { k: "nopiva", t: "Senza P.IVA", colore: "#e58a00", f: r => !r.piva },
      { k: "sede", t: "Collegati a una sede", colore: "#2f8bff", f: r => !!r.sede }
    ],
    azioniRiga: ["Modifica", "Vedi carichi", "Vedi ordini", "Nuovo ordine a questo fornitore"],
    colonne: [
      { k: "nome", t: "Ragione sociale", link: true, larg: 380 },
      { k: "piva", t: "Partita IVA" },
      { k: "cf", t: "Codice fiscale" },
      { k: "cod", t: "Codice" },
      { k: "sede", t: "Sede collegata", larg: 200 },
      { k: "usato", t: "Usato da", larg: 260 }
    ],
    dati
  });

  // Dopo l'accesso: i fornitori veri dal database. Come nel gestionale attuale ogni sede vede il SUO elenco
  // (tabella fornitori_sedi); col tasto "Anche delle altre sedi" si vedono tutti, per aggiungerne uno già esistente.
  dbPronto.then(async db => {
    if (!db) return;
    // Niente "sedi(nome)" dentro la lettura dei fornitori: con fornitori_sedi il database trova due collegamenti
    // tra fornitori e sedi e non sa quale usare. I nomi delle sedi si leggono a parte.
    const { data, error } = await db.from("fornitori")
      .select("id, codice, ragione_sociale, partita_iva, codice_fiscale, sede_collegata")
      .order("ragione_sociale");
    if (error) throw error;
    const { data: sedi } = await db.from("sedi").select("id, nome");
    const nomeSede = new Map((sedi || []).map(s => [s.id, s.nome]));
    const mie = await idFornitoriSedeDb(db);
    // in quali sedi è usato ogni fornitore
    const sediDi = new Map();
    const { data: legami } = await db.from("fornitori_sedi").select("fornitore_id, sede_id").range(0, 9999);
    (legami || []).forEach(l => sediDi.set(l.fornitore_id, (sediDi.get(l.fornitore_id) || []).concat(nomeSede.get(l.sede_id) || l.sede_id)));
    const tutte = data.map(f => ({
      nome: f.ragione_sociale, piva: f.partita_iva || "", cf: f.codice_fiscale || "",
      cod: f.codice, sede: nomeSede.get(f.sede_collegata) || "", usato: (sediDi.get(f.id) || []).join(", "),
      mio: !mie || mie.has(f.id)   // senza elenco per sede (tabella non ancora creata) si vedono tutti
    }));
    let tutti = false;
    const mostra = () => {
      pagina.aggiorna(tutti ? tutte : tutte.filter(r => r.mio));
      $btn.textContent = tutti ? "Solo di questa sede" : "Anche delle altre sedi";
    };
    const $btn = document.createElement("button");
    $btn.className = "btn btn-light";
    $btn.title = "Mostra anche i fornitori usati dalle altre sedi";
    $btn.onclick = () => { tutti = !tutti; mostra(); };
    document.getElementById("btnCrea").before($btn);
    mostra();
    avviso(mie ? `${tutte.filter(r => r.mio).length} fornitori di ${trovaSede(leggiSede()).nome}` : `${data.length} fornitori caricati dal database`);
  }).catch(err => pagina.errore("Non riesco a leggere i fornitori dal database: " + (err.message || err)));
</script>
</body>
</html>
