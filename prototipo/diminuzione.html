<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Diminuzione giacenza – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<link rel="stylesheet" href="css/scheda.css">
<style>
  /* Motivo della diminuzione: riquadri da cliccare invece della tendina "Tipo di movimento" */
  .motivi { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .motivo { display: flex; flex-direction: column; gap: 3px; padding: 11px 13px; border: 2px solid var(--line); border-radius: 11px; background: #fff; text-align: left; cursor: pointer; font: inherit; color: var(--text); }
  .motivo b { font-size: 0.92rem; }
  .motivo small { color: var(--muted); font-size: 0.78rem; line-height: 1.3; }
  .motivo .ico { font-size: 1.25rem; }
  .motivo:hover:not(:disabled) { border-color: #9cc3f5; }
  .motivo.scelto { border-color: #c62828; background: #fdf0f0; }
  .motivo.scelto b { color: #a01d1d; }
  .motivo:disabled { cursor: default; }
  .motivo:disabled:not(.scelto) { opacity: 0.45; }
  @media (max-width: 900px) { .motivi { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* Anno di acquisto ben visibile: è quello che si stampa sulle etichette */
  .anno-box { display: flex; align-items: center; gap: 10px; }
  .anno-box select { width: 110px; font-weight: 700; text-align: right; }
  .anno-box .vecchio { padding: 3px 9px; border-radius: 6px; background: #fff4d6; color: #9a6a00; font-size: 0.78rem; font-weight: 600; }
</style>
</head>
<body data-page="diminuzione-giacenza">

<template id="top-actions">
  <span class="spacer"></span>
  <button class="btn btn-light" id="btnExcel">📤 Excel</button>
  <button class="btn btn-light" id="btnChiudi">✕ Chiudi</button>
  <button class="btn btn-verde" id="btnModifica">✎ Modifica</button>
  <button class="btn btn-light" id="btnAnnulla" hidden>✕ Annulla</button>
  <button class="btn btn-primary" id="btnSalva" hidden>💾 Salva</button>
  <button class="btn btn-verde" id="btnSalvaChiudi" hidden>✔ Salva e chiudi</button>
</template>

<main class="content" id="contenuto"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js?v=20261126b"></script>
<script src="js/intestazioni.js"></script>
<script src="js/excel.js"></script>
<script src="js/elenco.js?v=20261126b"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli-reali.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/dati-carichi.js"></script>
<script src="js/righe-movimento.js"></script>
<script src="js/movimenti-db.js?v=20261127c"></script>
<script type="module">
  // Diminuzione giacenza: merce che esce dalla sede senza essere venduta né trasferita (rotta, mancante all'inventario,
  // smarrita, usata internamente). Si indica il costo d'acquisto; i pezzi escono dal lotto più vecchio (niente anno da scegliere).
  // Non si tolgono più pezzi di quelli in giacenza. ?nuovo=1 nuovo già in modifica · ?db=12 salvato nel database.
  // Definitivo = la merce esce subito dalla giacenza della sede. Colonna "motivo": database/16-aumento-giacenza.sql
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const nuovo = qs.has("nuovo");
  const dbId = +qs.get("db");
  const oggi = new Date().toISOString().slice(0, 10);
  const sedeLavoro = trovaSede(leggiSede()).nome;
  const ELENCO = "diminuzione-giacenza.html";

  const MOTIVI = [
    { k: "Rotto", ico: "💔", t: "Rotto o rovinato", s: "non più vendibile", es: "es. calice caduto durante l'allestimento" },
    { k: "Inventario", ico: "🔍", t: "Mancante all'inventario", s: "contando ne risultano meno", es: "es. inventario di novembre, scaffale B" },
    { k: "Smarrito", ico: "❔", t: "Smarrito o rubato", s: "non si trova più", es: "es. sparito dal banco espositivo" },
    { k: "Uso interno", ico: "🏠", t: "Uso interno o omaggio", s: "preso per la comunità o regalato", es: "es. dato in omaggio alla parrocchia di …" },
    { k: "Altro", ico: "✏️", t: "Altro", s: "scrivi il perché nella causale", es: "scrivi il motivo" }
  ];

  // Movimento salvato: si legge dal database prima di disegnare
  const movDb = dbId ? await dbPronto.then(db => db && leggiMovimentoDb(db, dbId, ID_SEDI_DB[sedeLavoro]))
    .catch(err => { avviso("Errore nel leggere la diminuzione: " + err.message); return null; }) : null;
  const mov = nuovo ? { stato: "Definitivo", data: oggi, motivo: "", causale: "", annotazioni: "" }
    : movDb && movDb.tipo === "diminuzione_giacenza" ? { id: movDb.id, stato: movDb.stato, data: movDb.data_movimento,
        motivo: movDb.motivo || "", causale: movDb.causale || "", annotazioni: movDb.annotazioni || "", creatoDa: movDb.creato_da, creatoIl: movDb.creato_il }
    : null;

  if (!mov) {
    $("contenuto").innerHTML = `<div class="panel"><div class="vuoto"><b>Diminuzione #${esc(dbId || "")} non trovata</b>
      <span><a href="${ELENCO}" style="color:var(--accent)">Torna all'elenco</a></span></div></div>`;
    document.querySelectorAll(".top-actions .btn").forEach(b => { if (b.id !== "btnChiudi") b.hidden = true; });
    $("btnChiudi").onclick = () => location.href = ELENCO;
    throw new Error("diminuzione non trovata");
  }
  const annullato = mov.stato === "Annullato";
  document.title = `${nuovo ? "Nuova diminuzione" : `Diminuzione #${mov.id}`} – Gestionale Magazzino`;

  const opz = (lista, scelto) => lista.map(o => `<option${String(o) === String(scelto) ? " selected" : ""}>${esc(o)}</option>`).join("");
  const campo = (cls, label, html, aiuto) => `<div class="f ${cls}"><label>${label}</label>${html}${aiuto ? `<span class="aiuto">${aiuto}</span>` : ""}</div>`;
  // non si tolgono più pezzi di quelli in giacenza (come nelle vendite)
  const CFG_RIGHE = { etichettaPrezzo: "Costo", spedita: true, soloSpedita: true, nelMovimento: "nella diminuzione", limiteGiacenza: true, verboUscita: "togliere", senzaOrdinata: true, senzaSconto: true, costoFisso: true, senzaAnno: true, perPezzo: true };

  $("contenuto").innerHTML = `
    <div class="scheda-head">
      <div>
        <h1 class="page-title">${nuovo ? "Nuova diminuzione giacenza" : `Diminuzione giacenza <span class="num">#${mov.id}</span>`} <span class="pill" id="pillStato"></span></h1>
        <div class="crumbs">
          <a href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
          <span>-</span><span>Movimenti</span><span>-</span><a href="${ELENCO}">Diminuzione Giacenza</a><span>-</span><span>${nuovo ? "Nuovo" : "#" + mov.id}</span>
        </div>
      </div>
      <div class="totale-top">
        <div class="t">Pezzi che escono</div>
        <div class="v" id="topTotale">0</div>
        <div class="p" id="topPezzi">0 pezzi · 0 righe</div>
      </div>
    </div>
    ${annullato ? '<div class="banner ann">✕ Questa diminuzione è annullata: non incide sulle giacenze e non si può modificare.</div>' : ""}
    <div class="banner provv" id="bannerProvv" hidden><span>◷</span><span>La diminuzione è <b>provvisoria</b>: la merce <b>non esce</b> ancora dalla giacenza.</span></div>
    <div class="banner mod" id="bannerModifica" hidden>✎ ${nuovo ? "Nuova diminuzione: scegli il motivo, poi aggiungi gli articoli (anche con la pistola)." : "Stai modificando la diminuzione. Ricordati di salvare."}</div>

    <section class="panel">
      <div class="schede" id="schede">
        <button class="scheda-tab active" data-t="dettagli">📄 Dettagli</button>
        <button class="scheda-tab" data-t="articoli">📦 Articoli <span class="n" id="nRigheTab">0</span></button>
        <button class="scheda-tab" data-t="storico">🕑 Storico modifiche</button>
        <span class="spazio"></span>
        <label class="interr"><span class="switch"><input type="checkbox" id="ordinaCodice"><span></span></span> Ordina per codice</label>
      </div>

      <!-- DETTAGLI -->
      <div class="pannello-tab" id="tab-dettagli">
        <div class="dettagli">
          <div>
            <div class="gruppo">
              <h3>❓ Perché esce questa merce</h3>
              <div class="motivi" id="motivi">
                ${MOTIVI.map(m => `<button type="button" class="motivo mod${m.k === mov.motivo ? " scelto" : ""}" data-motivo="${m.k}" disabled>
                  <span class="ico">${m.ico}</span><b>${m.t}</b><small>${m.s}</small></button>`).join("")}
              </div>
            </div>
            <div class="gruppo">
              <h3>📄 Movimento</h3>
              <div class="campi">
                ${campo("s3", "Stato movimento", `<div class="stato-sel"><span class="dot" id="dotStato"></span><select class="mod" id="selStato" disabled>${opz(["Provvisorio", "Definitivo"].concat(annullato ? ["Annullato"] : []), mov.stato)}</select><button class="btn solo-mod" id="btnProvv" style="padding:6px 10px;font-size:0.8rem;white-space:nowrap"></button></div>`, "provvisorio = la merce non esce ancora")}
                ${campo("s2", "Data", `<input class="mod" type="date" id="fData" value="${mov.data}" disabled>`)}
                ${campo("s2", "Sede", `<input value="${esc(sedeLavoro)}" disabled>`, "i pezzi escono dal lotto più vecchio")}
                ${campo("s1", "ID", `<input value="${mov.id ?? ""}" placeholder="nuovo" disabled style="text-align:right">`, "assegnato al salvataggio")}
              </div>
            </div>
            <div class="gruppo">
              <h3>📝 Note</h3>
              <div class="campi">
                ${campo("s3", "Causale", `<textarea class="mod" id="fCausale" disabled>${esc(mov.causale)}</textarea>`, "non stampata sul documento")}
                ${campo("s3", "Annotazioni", `<textarea class="mod" id="fAnnot" disabled>${esc(mov.annotazioni)}</textarea>`, "stampate sul documento")}
              </div>
            </div>
          </div>
          <aside class="riepilogo">
            <h3>Riepilogo</h3>
            <div class="voce-imp fissa"><label>Pezzi che escono</label><input id="impPezzi" value="0" disabled></div>
          </aside>
        </div>
      </div>

      <!-- ARTICOLI -->
      <div class="pannello-tab" id="tab-articoli" hidden>
        ${righeHtmlAggiungi()}
        <div class="art-toolbar">
          <div class="nota-viola" style="flex:1">💶 Il <b>costo</b> è quello della scheda articolo. La quantità che esce va in <b>Esce</b>: non più di quella in giacenza.</div>
          <label class="interr"><span class="switch"><input type="checkbox" id="nuoviInAlto" checked><span></span></span> Nuovi articoli in alto</label>
        </div>
        ${righeHtmlTabella(CFG_RIGHE).replace('title="Quanto è uscito davvero">Spedita', 'title="Pezzi che escono dalla giacenza">Esce')}
      </div>

      <!-- STORICO -->
      <div class="pannello-tab" id="tab-storico" hidden>
        ${movDb ? `<div class="timeline"><div class="evento ok"><div class="quando">${new Date(mov.creatoIl).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" })} · ${esc(mov.creatoDa || "")}</div><div class="cosa">Diminuzione salvata</div><div class="dett">Stato ${mov.stato}${mov.motivo ? " · " + esc(mov.motivo) : ""}</div></div></div>`
          : `<div class="vuoto"><b>Diminuzione non ancora salvata</b><span>Dopo il salvataggio qui comparirà chi lo ha creato e modificato.</span></div>`}
      </div>
    </section>`;

  // ---------- Schede ----------
  $("schede").onclick = e => {
    const b = e.target.closest(".scheda-tab");
    if (!b) return;
    document.querySelectorAll(".scheda-tab").forEach(t => t.classList.toggle("active", t === b));
    document.querySelectorAll(".pannello-tab").forEach(p => p.hidden = p.id !== "tab-" + b.dataset.t);
  };

  // ---------- Motivo e anno ----------
  let motivo = mov.motivo;
  const esempioCausale = () => (MOTIVI.find(m => m.k === motivo) || MOTIVI[0]).es;
  $("motivi").onclick = e => {
    const b = e.target.closest("[data-motivo]");
    if (!b || b.disabled) return;
    motivo = b.dataset.motivo;
    document.querySelectorAll(".motivo").forEach(x => x.classList.toggle("scelto", x === b));
    $("fCausale").placeholder = esempioCausale();
    if (motivo === "Altro") $("fCausale").focus();
  };
  $("fCausale").placeholder = esempioCausale();

  // ---------- Stato ----------
  function mostraStato() {
    const s = Object.values(STATO).find(x => x.nome === $("selStato").value);
    const provv = s.nome === "Provvisorio";
    $("dotStato").style.background = s.colore;
    $("pillStato").style.cssText = `background:${s.colore}1f;color:${s.colore}`;
    $("pillStato").textContent = `${s.icona} ${s.nome}`;
    $("btnProvv").textContent = provv ? "Rendi definitivo" : "Rendi provvisorio";
    $("btnProvv").className = "btn solo-mod " + (provv ? "btn-giallo" : "btn-primary");
    $("btnProvv").hidden = annullato;
    $("bannerProvv").hidden = !provv;
  }
  $("selStato").onchange = mostraStato;
  $("btnProvv").onclick = () => { $("selStato").value = $("selStato").value === "Definitivo" ? "Provvisorio" : "Definitivo"; mostraStato(); };
  mostraStato();

  // ---------- Righe (costo d'acquisto; la quantità che entra è nella colonna Arrivata) ----------
  const righe = avviaRighe({
    ...CFG_RIGHE,
    prezzoDi: art => art.costo,
    sedeEstera: () => trovaSede(leggiSede()).estera,
    giacenzaNeiSuggerimenti: true,
    testoVuoto: () => "Spara i barcode con la pistola, oppure usa il tasto ＋ e scrivi il codice.",
    cambiato: () => ricalcola()
  });
  function ricalcola() {
    $("impPezzi").value = righe.pezzi();
    // niente somme di valore (deciso con l'utente): solo i pezzi
    $("topTotale").textContent = righe.pezzi();
    $("topPezzi").textContent = `${righe.RIGHE.length} ${righe.RIGHE.length === 1 ? "articolo" : "articoli"}`;
    $("nRigheTab").textContent = righe.RIGHE.length;
  }
  // ---------- Etichette: non servono (la merce esce) ----------
  // ---------- Modifica / salva ----------
  const pulsantiLettura = ["btnExcel", "btnChiudi", "btnModifica"];
  let valoriPrima = [], righePrima = [], motivoPrima = motivo;
  function modalita(modifica) {
    document.body.classList.toggle("in-modifica", modifica);
    document.querySelectorAll(".mod").forEach(el => el.disabled = !modifica);
    pulsantiLettura.forEach(id => $(id).hidden = modifica || (id === "btnModifica" && annullato));
    ["btnAnnulla", "btnSalva", "btnSalvaChiudi", "bannerModifica"].forEach(id => $(id).hidden = !modifica);
    righe.disegna();
  }
  function controlla() {
    if (!motivo) { avviso("Scegli perché esce la merce (Rotto, Mancante all'inventario, Smarrito, Uso interno, Altro)"); document.querySelector('.scheda-tab[data-t="dettagli"]').click(); return false; }
    if (motivo === "Altro" && !$("fCausale").value.trim()) { avviso("Con \"Altro\" scrivi il motivo nella causale"); document.querySelector('.scheda-tab[data-t="dettagli"]').click(); $("fCausale").focus(); return false; }
    const oltre = righe.oltreGiacenza();
    if (oltre) { avviso(oltre + ": correggi la quantità", true); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    if (righe.senzaArticolo()) { avviso("C'è una riga senza articolo: scegli l'articolo o eliminala con il cestino"); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    if (!righe.RIGHE.some(r => r.sped > 0)) { avviso("Aggiungi almeno un articolo nella scheda Articoli"); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    return true;
  }
  $("btnModifica").onclick = () => {
    valoriPrima = [...document.querySelectorAll(".mod")].map(el => el.value);
    righePrima = righe.fotografia(); motivoPrima = motivo;
    modalita(true);
  };
  $("btnAnnulla").onclick = () => {
    if (nuovo) {
      if (!righe.RIGHE.length || confirm("Uscire senza salvare la diminuzione?")) location.href = ELENCO;
      return;
    }
    document.querySelectorAll(".mod").forEach((el, i) => el.value = valoriPrima[i]);
    motivo = motivoPrima;
    document.querySelectorAll(".motivo").forEach(x => x.classList.toggle("scelto", x.dataset.motivo === motivo));
    righe.ripristina(righePrima);
    mostraStato(); ricalcola(); modalita(false);
  };
  async function salva(chiudi) {
    if (!controlla()) return;
    const db = await dbPronto;
    if (!db) { avviso("Per salvare serve l'accesso al database"); return; }
    const lista = righe.RIGHE.filter(r => r.sped > 0);
    if (lista.some(r => !r.articolo.id)) { avviso("Ci sono articoli di esempio: ricarica la pagina per usare quelli del database"); return; }
    const testo = id => $(id).value.trim() || null;
    const dati = {
      tipo: "diminuzione_giacenza", stato: $("selStato").value, sede_id: ID_SEDI_DB[sedeLavoro],
      data_movimento: $("fData").value || oggi, motivo,
      causale: testo("fCausale"), annotazioni: testo("fAnnot"), spese: 0
    };
    const pulsanti = ["btnSalva", "btnSalvaChiudi"].map($);
    pulsanti.forEach(b => b.disabled = true);
    try {
      const id = await salvaMovimentoDb(db, dati, lista.map(r => ({
        articolo_id: r.articolo.id, quantita: r.sped, prezzo: r.prezzo, sconto: r.sconto || 0, etichette: 0
      })), mov.id);
      avviso(dati.stato === "Definitivo" ? `Diminuzione salvata: ${righe.pezzi()} pezzi tolti dalla giacenza di ${sedeLavoro}`
        : "Diminuzione salvata come provvisoria: la giacenza non cambia finché non è definitiva");
      setTimeout(() => location.replace(chiudi ? ELENCO : `diminuzione.html?db=${id}`), 900);
    } catch (err) {
      // colonna motivo mancante: va eseguito il file SQL 16
      avviso(err.code === "PGRST204" || err.code === "42703" ? "Prima va eseguito su Supabase il file database/16-aumento-giacenza.sql" : "Errore nel salvare: " + err.message);
      pulsanti.forEach(b => b.disabled = false);
    }
  }
  $("btnSalva").onclick = () => salva(false);
  $("btnSalvaChiudi").onclick = () => salva(true);
  $("btnChiudi").onclick = () => location.href = ELENCO;
  $("btnExcel").onclick = () => righe.excel({ sede: sedeLavoro, tipo: "Diminuzione Giacenza", numero: mov.id || null,
    riepilogo: [["Data Documento", dataIt($("fData").value || oggi)], ["Motivo", motivo], ["Causale", $("fCausale").value]], spese: [] });

  // Righe già salvate: se la diminuzione era definitiva i suoi pezzi sono già stati tolti dalla giacenza (contano come disponibili)
  if (movDb && mov.id) righe.carica(movDb.righe.map(r => ({ qta: +r.quantita, prezzo: +r.prezzo, sconto: +r.sconto, articolo: r.articolo,
    giaScaricati: mov.stato === "Definitivo" ? +r.quantita : 0 })));
  ricalcola();
  modalita(nuovo);

  // Dopo l'accesso la ricerca articoli (e la pistola) usa gli articoli del database, con la giacenza della sede
  dbPronto.then(db => db && caricaArticoliDalDb(db, ID_SEDI_DB[sedeLavoro]))
    .catch(err => avviso("Errore nel leggere gli articoli: " + err.message));
  // Inventario in corso in questa sede: avviso in alto (non fare vendite né scarichi)
  dbPronto.then(db => avvisaInventarioInCorso(db, ID_SEDI_DB[trovaSede(leggiSede()).nome])).catch(() => {});
</script>
</body>
</html>
