<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Vendite Giornaliere – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  .fin-sfondo { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(20,30,50,0.45); }
  .fin-sfondo.show { display: flex; }
  .fin { width: min(460px, 100%); padding: 22px; border-radius: 14px; background: #fff; box-shadow: 0 20px 60px rgba(20,30,50,0.3); }
  .fin h3 { margin-bottom: 6px; font-size: 1.05rem; }
  .fin p { margin-bottom: 14px; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .fin input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; }
  .fin .tasti { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body data-page="vendite-giornaliere" data-top="elenco">
<main class="content"></main>

<div class="fin-sfondo" id="finMese">
  <div class="fin">
    <h3>🖨️ Trasferimento e-commerce del mese</h3>
    <p>Stampa su carta intestata del <b>Trasferimento a Filiale</b> per la <b>Sede Centrale dell'Apostolato Liturgico</b>, con tutti gli articoli venduti online dalla sede in cui lavori nel mese scelto.</p>
    <label style="font-size:0.8rem;font-weight:600;color:var(--muted)">Mese <input type="month" id="meseEcom" style="margin-left:8px"></label>
    <div class="tasti"><button class="btn btn-light" id="meseAnnulla">Annulla</button><button class="btn btn-primary" id="meseStampa">🖨️ Stampa trasferimento</button></div>
  </div>
</div>

<script src="js/sedi.js"></script>
<script src="js/layout.js?v=20261126b"></script>
<script src="js/elenco.js?v=20261126b"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-vendite.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js?v=20261127"></script>
<script src="js/excel.js"></script>
<script>
  // ?canale=ecommerce → solo le giornate di vendite online (lista a parte); senza → solo le giornate del negozio
  const ECOM = new URLSearchParams(location.search).get("canale") === "ecommerce";
  const eEcom = r => /^E-?COMMERCE/i.test(r.causale || "");
  const oggiIso = new Date().toISOString().slice(0, 10);
  const elenco = avviaElenco({
    titolo: ECOM ? "Vendite e-commerce" : "Vendite Giornaliere",
    nota: ECOM ? "🛒 Una giornata per ogni giorno di vendite online: la merce esce dalla giacenza della sede in cui lavori. Durante il giorno si aprono le <b>vendite di oggi</b> e si aggiungono gli articoli man mano, con l'ora." : undefined,
    nuovo: ECOM ? "Nuova vendita e-commerce" : "Nuova vendita",
    senzaEtichette: true,   // niente Etichette in alto (chiesto dall'utente)
    nuovoUrl: ECOM ? "vendita.html?nuovo=1&canale=ecommerce" : undefined,
    dettaglio: "vendita.html",
    csv: "vendite-giornaliere",
    stati: [STATO.definitivo, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: [],
    colonne: [
      COL.giorno("data", "Giorno"),
      COL.testo("causale", "Causale", 340),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: []
  });

  // Vendite del centro / Vendite e-commerce: due tasti sempre nello stesso posto, quello della lista aperta è blu
  // (nel gestionale attuale l'e-commerce era un trasferimento mensile alla Sede Centrale)
  // A sinistra (subito dopo "Record attuali"): così restano fermi anche se i tasti a destra cambiano
  document.getElementById("recordAttuali").closest("label").insertAdjacentHTML("afterend", `
    <div class="scelta-canale" role="tablist" aria-label="Quali vendite vedere">
      <a href="vendite-giornaliere.html" role="tab" aria-selected="${!ECOM}" class="${ECOM ? "" : "attivo"}" title="Le giornate di vendita del centro">🏪 Vendite del centro</a>
      <a href="vendite-giornaliere.html?canale=ecommerce" role="tab" aria-selected="${ECOM}" class="${ECOM ? "attivo" : ""}" title="Le giornate di vendite online">🛒 Vendite e-commerce</a>
    </div>`);

  // ---------- Trasferimento e-commerce del mese per la Sede Centrale dell'Apostolato Liturgico ----------
  // La merce venduta online esce dalla giacenza della sede che spedisce (giornate e-commerce); a fine mese la Sede Centrale
  // riceve la stampa del Trasferimento a Filiale con tutti gli articoli venduti (il file Excel non serve: tolto il 24/11/2026).
  if (ECOM) document.getElementById("btnCrea").insertAdjacentHTML("beforebegin",
    `<button class="btn btn-light" id="btnRiepEcom" title="Stampa del mese per la Sede Centrale dell'Apostolato Liturgico" style="color:#5b21b6;border-color:#cdb8f5">🖨️ Trasferimento del mese</button>`);
  const $m = id => document.getElementById(id);
  if (ECOM) $m("btnRiepEcom").onclick = () => { $m("meseEcom").value = new Date().toISOString().slice(0, 7); $m("finMese").classList.add("show"); };
  $m("meseAnnulla").onclick = () => $m("finMese").classList.remove("show");
  // Giornate e-commerce del mese scelto (sede di lavoro), lette dal database; null se manca qualcosa (l'avviso è già mostrato)
  async function giornateDelMese() {
    const mese = $m("meseEcom").value;
    if (!/^\d{4}-\d{2}$/.test(mese)) { avviso("Scegli il mese"); return null; }
    const db = await dbPronto;
    if (!db) { avviso("Serve l'accesso al database"); return null; }
    const sede = trovaSede(leggiSede()).nome;
    const [a, m] = mese.split("-").map(Number);
    const fine = new Date(Date.UTC(a, m, 0)).toISOString().slice(0, 10);
    const nomeMese = new Date(a, m - 1, 1).toLocaleDateString("it-IT", { month: "long", year: "numeric" });
    const { data, error } = await db.from("movimenti")
      .select("id, data_movimento, causale, movimenti_righe(quantita, prezzo, sconto, totale, articoli(id, codice, descrizione, barcode, costo_netto, fornitore_id, unita_misura, aliquote_iva(aliquota)))")
      .eq("tipo", "vendite_giornaliere").eq("sede_id", ID_SEDI_DB[sede]).in("stato", ["Definitivo", "Evaso"])
      .gte("data_movimento", mese + "-01").lte("data_movimento", fine).order("data_movimento");
    if (error) throw error;
    const giornate = (data || []).filter(g => /^E-?COMMERCE/i.test(g.causale || ""));
    if (!giornate.length) { avviso(`Nessuna vendita e-commerce di ${sede} in ${nomeMese}`, true); return null; }
    return { db, sede, mese, a, m, fine, nomeMese, giornate };
  }

  // ---------- Stampa del mese: "Trasferimento a Filiale" alla Sede Centrale su carta intestata (stampa-documento.html) ----------
  // Identica alla stampa dell'ordine a fornitore: in alto a sinistra noi (la sede che ha spedito), a destra il destinatario (Sede Centrale).
  // Una riga per articolo con i pezzi di tutto il mese; prezzi come nell'ordine: Pr. Unit. = costo d'acquisto, Sconto %, IVA,
  // importo di riga IVA inclusa arrotondato ai 5 centesimi, totali = somma degli importi arrotondati. Niente note.
  // Data = ultimo giorno del mese (oggi, se il mese non è finito); numero = mese/anno (uno per mese e per sede).
  const SEDE_CENTRALE = ["SEDE CENTRALE APOSTOLATO LITURGICO", "Via Portuense, 739", "00148 Roma (RM)", "Telefono: 0665656224"];
  $m("meseStampa").onclick = async () => {
    $m("meseStampa").disabled = true;
    try {
      const x = await giornateDelMese();
      if (!x) return;
      const perArticolo = new Map();
      for (const g of x.giornate) for (const r of g.movimenti_righe) {
        const art = r.articoli || {};
        const y = perArticolo.get(art.id) || { art, qta: 0 };
        y.qta += +r.quantita;
        perArticolo.set(art.id, y);
      }
      const cent = v => Math.round(v * 100) / 100;
      const righeSt = [...perArticolo.values()].filter(y => y.qta).sort((p, q) => String(p.art.codice).localeCompare(String(q.art.codice)))
        .map((y, i) => {
          const costo = cent(+y.art.costo_netto || 0), iva = y.art.aliquote_iva ? +y.art.aliquote_iva.aliquota : 22;
          const importo = Math.round(y.qta * costo * (1 + iva / 100) * 20 + 1e-6) / 20;   // ai 5 centesimi, come nell'ordine
          return { n: i + 1, cod: y.art.codice, descr: y.art.descrizione, importoNum: importo,
            qta: y.qta.toLocaleString("it-IT", { maximumFractionDigits: 2 }) + (y.art.unita_misura === "Metri" ? " mt" : ""),
            prezzo: numero(costo), sconto: "", iva: iva + "%", importo: numero(importo) };
        });
      const tot = cent(righeSt.reduce((s, r) => s + r.importoNum, 0));
      const data = x.fine < oggiIso ? x.fine : oggiIso;
      sessionStorage.setItem("stampa", JSON.stringify({
        titolo: "Trasferimento a Filiale", sede: x.sede,
        info: [["Data", dataIt(data)], ["Numero", `${x.m}/${x.a}`]],
        destinatario: SEDE_CENTRALE,
        colonne: [{ k: "n", t: "#" }, { k: "cod", t: "Codice", cod: true }, { k: "descr", t: "Descrizione" }, { k: "qta", t: "Quantità", num: true },
          { k: "prezzo", t: "Pr. Unit.", num: true }, { k: "sconto", t: "Sconto %", num: true }, { k: "iva", t: "IVA", num: true }, { k: "importo", t: "Importo", num: true }],
        righe: righeSt,
        totali: [["Totale Articoli", numero(tot)], ["= Totale Complessivo", numero(tot)]],
        ritorno: "vendite-giornaliere.html?canale=ecommerce"
      }));
      registra("Stampa trasferimento e-commerce del mese", `${x.sede} – ${x.nomeMese}`);
      location.href = "stampa-documento.html?auto=1";
    } catch (err) { avviso("Errore nel preparare la stampa: " + err.message, true); }
    finally { $m("meseStampa").disabled = false; }
  };

  // Dopo l'accesso: le giornate salvate nel database, in cima a quelle di esempio
  dbPronto.then(async db => {
    if (!db) return;
    const tutte = await elencoMovimentiDb(db, "vendite_giornaliere", ID_SEDI_DB[trovaSede(leggiSede()).nome], "vendita.html");
    const righe = tutte.filter(r => eEcom(r) === ECOM);
    if (righe.length) elenco.aggiungi(righe);
    // "Nuova vendita e-commerce": se la giornata di oggi c'è già si apre lì, pronta per aggiungere articoli (il nome del tasto resta uguale)
    if (ECOM) {
      const oggi = righe.find(r => r.data === oggiIso && r.stato !== "Annullato");
      if (oggi) {
        const b = document.getElementById("btnCrea");
        b.onclick = () => location.href = `vendita.html?db=${oggi.id}&modifica=1`;
        b.title = "Si aggiunge alla giornata e-commerce di oggi, già aperta";
      }
    }
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
