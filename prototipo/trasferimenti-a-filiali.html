<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trasferimenti a Filiali – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  .ordini-da-preparare { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; padding: 14px 16px; border: 2px solid #ffc531; border-radius: 12px; background: #fffaeb; }
  .ordini-da-preparare a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: #fff; color: var(--text); text-decoration: none; font-weight: 500; }
  .ordini-da-preparare a:hover { background: #eef5ff; }
  .ordini-da-preparare a span { margin-left: auto; padding: 4px 12px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 600; font-size: 0.82rem; }
</style>
</head>
<body data-page="trasferimenti-a-filiali" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Speculare a Trasferimenti da Filiali: qui la merce esce verso un'altra sede
  const elenco = avviaElenco({
    titolo: "Trasferimenti a Filiali",
    nota: "🔄 Scegli la <b>sede che riceve</b>: quando il trasferimento è <b>definitivo</b> la merce esce da qui ed entra <b>in automatico</b> nella giacenza dell'altra sede. Verso le sedi estere senza IVA (0%).",
    nuovo: "Nuovo trasferimento",
    dettaglio: "trasferimento.html",
    csv: "trasferimenti-a-filiali",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    controparte: { filtro: "Sede di destinazione", elenco: SEDI_CP },
    azioniRiga: ["Modifica", "Stampa DDT", "Stampa etichette", "Duplica"],
    colonne: [
      COL.numero("Protocollo / Mov."),
      COL.stato(),
      COL.data("data", "Data"),
      COL.controparte("Verso sede", 200),
      COL.testo("causale", "Causale", 160),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: [
      { id: 8811, prot: "2026-000245", stato: "Provvisorio", data: "2026-10-20", cp: sede("CAL Bari"), causale: "Riassortimento Natale", tot: 1240.5, nArt: 48, ricevuti: 0, lab: "Laboratori Sede Centrale" },
      { id: 8805, prot: "2026-000243", stato: "Definitivo", data: "2026-10-16", cp: sede("CAL Milano"), causale: "", tot: 860.2, nArt: 31, ricevuti: 31, lab: "Laboratori Sede Centrale" },
      { id: 8793, prot: "2026-000240", stato: "Definitivo", data: "2026-10-14", cp: sede("CAL Palermo"), causale: "", tot: 395.89, nArt: 13, ricevuti: 9, lab: "Laboratori Sede Centrale" },
      { id: 8761, prot: "2026-000236", stato: "Definitivo", data: "2026-10-08", cp: sede("CAL Firenze"), causale: "", tot: 2105, nArt: 72, ricevuti: 72, lab: "Laboratorio Confezione Sede Centrale" },
      { id: 8740, stato: "Annullato", data: "2026-10-03", cp: sede("CAL Cagliari"), causale: "", tot: 0, nArt: 0, ricevuti: 0, lab: "Laboratori Sede Centrale" }
    ]
  });

  // Dopo l'accesso: i trasferimenti salvati nel database fatti da questa sede, in cima a quelli di esempio
  dbPronto.then(async db => {
    if (!db) return;
    const sedeId = ID_SEDI_DB[trovaSede(leggiSede()).nome];
    const righe = await elencoMovimentiDb(db, "trasferimento_a_filiale", sedeId, "trasferimento.html");
    if (righe.length) elenco.aggiungi(righe);
    // Ordini delle filiali arrivati a questa sede e non ancora preparati: in cima, si aprono per fare il trasferimento
    const daPreparare = await inevasiDb(db, { sede_fornitrice: sedeId, stato_ordine: "Definitivo" }, { soloResiduo: false });
    const ordini = new Map();
    daPreparare.forEach(r => {
      const o = ordini.get(r.ordine_id) || { id: r.ordine_id, da: r.nomeRichiedente, data: r.data_ordine, righe: 0, pezzi: 0 };
      o.righe++; o.pezzi += r.ordinata;
      ordini.set(r.ordine_id, o);
    });
    if (ordini.size) document.querySelector(".page-head").insertAdjacentHTML("afterend", `
      <div class="ordini-da-preparare">
        <b>📦 Ordini delle filiali da preparare: ${ordini.size}</b>
        ${[...ordini.values()].map(o => `<a href="trasferimento.html?nuovo=1&ordine=${o.id}">${esc(o.da)} · ordine #${o.id} del ${dataIt(o.data)} · ${o.righe} articoli, ${o.pezzi} pezzi <span>Apri →</span></a>`).join("")}
      </div>`);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
