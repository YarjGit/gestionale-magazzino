<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aumento Giacenza – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="aumento-giacenza" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/dati-aumenti.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Rettifica in aumento: nessun cliente né fornitore. Merce ritrovata all'inventario, da altri centri o sedi chiuse, donata.
  const elenco = avviaElenco({
    titolo: "Aumento Giacenza",
    nuovo: "Nuovo aumento",
    nota: "➕ Per la merce che entra <b>senza un fornitore</b>: ritrovata all'inventario, arrivata da altri centri o da sedi chiuse, donata. Quando è <b>definitivo</b> la merce entra nella giacenza di questa sede, con l'anno di acquisto scelto (si stampa sulle etichette).",
    dettaglio: "aumento.html",
    csv: "aumento-giacenza",
    stati: [STATO.definitivo, STATO.provvisorio, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("causale", "Causale", 260),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.intero("nArt", "Pezzi")
    ],
    dati: DATI_AUMENTI
  });

  // Dopo l'accesso: gli aumenti salvati nel database, in cima a quelli di esempio
  dbPronto.then(async db => {
    if (!db) return;
    const righe = await elencoMovimentiDb(db, "aumento_giacenza", ID_SEDI_DB[trovaSede(leggiSede()).nome], "aumento.html");
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
