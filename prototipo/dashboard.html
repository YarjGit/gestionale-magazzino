<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 18px;
  }
  .stat {
    background: var(--panel);
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 4px solid var(--accent);
    box-shadow: 0 2px 8px rgba(20,30,50,0.05);
  }
  .stat .n { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
  .stat .t { color: var(--muted); font-size: 0.8rem; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--line);
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .section-title .count {
    margin-left: auto;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--page-bg);
    color: var(--muted);
  }
  .section + .section { margin-top: 30px; }

  .filter {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter label { font-weight: 600; }
  .filter select {
    flex: 1;
    min-width: 220px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 16px;
  }
  .card {
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(20,30,50,0.06);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, outline-color 0.15s;
    outline: 3px solid transparent;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,30,50,0.1); }
  .card.selected { outline-color: #d4148c; }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--accent), #4aa3ff);
    color: #fff;
    font-weight: 700;
  }
  .card-head.trasf { background: linear-gradient(135deg, #1aa6b8, var(--accent-2)); }
  .card-head .name { flex: 1; text-transform: uppercase; font-size: 0.92rem; }
  .card-head .tot { white-space: nowrap; }
  .card-body {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: space-between;
    gap: 4px 16px;
    padding: 10px 16px 12px;
  }
  .card-body.three { grid-template-columns: repeat(3, auto); }
  .k { color: var(--muted); font-size: 0.78rem; font-weight: 500; }
  .v { font-weight: 500; }
  .r { text-align: right; }

  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr; }
    .card-body { grid-template-columns: 1fr 1fr; }
    .card-body .r { text-align: left; }
  }
</style>
</head>
<body data-page="dashboard">

<main class="content">
  <h1 class="page-title">Dashboard</h1>
  <div class="crumbs">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
    <span>-</span><span>Dashboard</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <section class="section" id="sezRicevuti">
      <h2 class="section-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        Ordini ricevuti dalle filiali (da preparare)
        <span class="count" id="countRicevuti">…</span>
      </h2>
      <div class="cards" id="ricevuti"><p class="empty">Lettura degli ordini…</p></div>
      <p style="margin-top:10px"><a href="inevasi.html" style="color:var(--accent);font-weight:600" id="linkInevasi">⏳ Inevasi da mandare alle filiali</a></p>
    </section>

    <section class="section">
      <h2 class="section-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>
        Ordini inviati da altri negozi
        <span class="count" id="countIn"></span>
      </h2>
      <div class="cards" id="inArrivo"></div>
    </section>

    <section class="section">
      <h2 class="section-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h14v12H1z"/><path d="M15 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        Movimenti da evadere o ancora in lavorazione
        <span class="count" id="countOpen"></span>
      </h2>
      <div class="filter">
        <label for="esamina">Esamina consegna</label>
        <select id="esamina"></select>
      </div>
      <div class="cards" id="daEvadere"></div>
    </section>
  </div>
</main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // ---------- Dati di esempio ----------
  const inArrivo = [
    { da: "Magazzino centrale", num: "2026/000294", tipo: "Trasferimento a filiale", data: "11/08/2026", articoli: 1, tot: 137 }
  ];

  const daEvadere = [
    { nome: "Fornitore Esempio SNC", tipo: "Ordine a fornitore", data: "24/08/2026", stato: "Provvisorio", art: "6 / 0", tot: 102.48 },
    { nome: "Passamaneria Esempio", tipo: "Ordine a fornitore", data: "13/01/2026", stato: "Provvisorio", art: "0 / 0", tot: 0 },
    { nome: "Magazzino centrale", tipo: "Trasferimento a filiale", data: "02/09/2026", stato: "Confermato", art: "18 / 12", tot: 2077.69 },
    { nome: "Tessuti Esempio SRL", tipo: "Carico da fornitore", data: "15/09/2026", stato: "Provvisorio", art: "24 / 10", tot: 845.3 }
  ];

  document.getElementById("stats").innerHTML = [
    ["Ordini in arrivo", inArrivo.length],
    ["Movimenti aperti", daEvadere.length],
    ["Valore da evadere", euro(daEvadere.reduce((s, m) => s + m.tot, 0))],
    ["Articoli sottoscorta", 7]
  ].map(([t, n]) => `<div class="stat"><div class="t">${t}</div><div class="n">${n}</div></div>`).join("");

  document.getElementById("countIn").textContent = inArrivo.length;
  document.getElementById("countOpen").textContent = daEvadere.length;

  document.getElementById("inArrivo").innerHTML = inArrivo.length ? inArrivo.map(o => `
    <div class="card">
      <div class="card-head trasf">
        <span class="name">${o.da} (${o.num})</span><span class="tot">${euro(o.tot)}</span>
      </div>
      <div class="card-body three">
        <div><div class="k">Tipo di movimento</div><div class="v">${o.tipo}</div></div>
        <div><div class="k">Data</div><div class="v">${o.data}</div></div>
        <div class="r"><div class="k">Articoli</div><div class="v">${o.articoli}</div></div>
      </div>
    </div>`).join("") : '<p class="empty">Nessun ordine in arrivo.</p>';

  const cardsOpen = document.getElementById("daEvadere");
  cardsOpen.innerHTML = daEvadere.map((m, i) => `
    <div class="card" data-i="${i}">
      <div class="card-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        <span class="name">${m.nome}</span><span class="tot">${euro(m.tot)}</span>
      </div>
      <div class="card-body">
        <div><div class="k">Tipo di movimento</div><div class="v">${m.tipo}</div></div>
        <div><div class="k">Data</div><div class="v">${m.data}</div></div>
        <div><div class="k">Stato</div><div class="v"><span class="pill ${m.stato === "Confermato" ? "conf" : "prov"}">${m.stato}</span></div></div>
        <div class="r"><div class="k">Articoli</div><div class="v">${m.art}</div></div>
      </div>
    </div>`).join("");

  const sel = document.getElementById("esamina");
  sel.innerHTML = '<option value="">[Seleziona la consegna da esaminare]</option>' +
    daEvadere.map((m, i) => `<option value="${i}">${m.nome} – ${m.tipo} del ${m.data}</option>`).join("");

  const evidenzia = i => {
    cardsOpen.querySelectorAll(".card").forEach(c => c.classList.toggle("selected", c.dataset.i === String(i)));
    const c = cardsOpen.querySelector(`[data-i="${i}"]`);
    if (c) c.scrollIntoView({ behavior: "smooth", block: "center" });
  };
  sel.onchange = () => evidenzia(sel.value);
  cardsOpen.querySelectorAll(".card").forEach(c => c.onclick = () => { sel.value = c.dataset.i; evidenzia(c.dataset.i); });

  // ---------- Ordini ricevuti dalle filiali (dal database) ----------
  // Ordini a fornitore Definitivi il cui fornitore è questa sede (es. SMM → Magazzino Centrale), ancora da preparare.
  // Cliccando si prepara il trasferimento: quello che non c'è resta negli inevasi.
  dbPronto.then(async db => {
    if (!db) return;
    const sede = ID_SEDI_DB[trovaSede(leggiSede()).nome];
    const [daPreparare, inevasi] = await Promise.all([
      inevasiDb(db, { sede_fornitrice: sede, stato_ordine: "Definitivo" }, { soloResiduo: false }),
      inevasiDb(db, { sede_fornitrice: sede, stato_ordine: "Evaso" })
    ]);
    const ordini = new Map();
    daPreparare.forEach(r => {
      const o = ordini.get(r.ordine_id) || { id: r.ordine_id, da: r.nomeRichiedente, data: r.data_ordine, righe: 0, pezzi: 0, disponibili: 0 };
      o.righe++; o.pezzi += r.ordinata;
      if ((r.articolo.giac ?? 0) >= r.ordinata) o.disponibili++;
      ordini.set(r.ordine_id, o);
    });
    const lista = [...ordini.values()];
    document.getElementById("countRicevuti").textContent = lista.length;
    document.getElementById("ricevuti").innerHTML = lista.length ? lista.map(o => `
      <div class="card" onclick="location.href='trasferimento.html?nuovo=1&ordine=${o.id}'" title="Prepara il trasferimento">
        <div class="card-head trasf"><span class="name">${esc(o.da)} · ordine #${o.id}</span><span class="tot">${o.pezzi} pezzi</span></div>
        <div class="card-body three">
          <div><div class="k">Data ordine</div><div class="v">${dataIt(o.data)}</div></div>
          <div><div class="k">Articoli</div><div class="v">${o.righe}</div></div>
          <div class="r"><div class="k">Disponibili ora</div><div class="v">${o.disponibili} di ${o.righe}</div></div>
        </div>
      </div>`).join("") : '<p class="empty">Nessun ordine da preparare.</p>';
    const nInevasi = new Set(inevasi.map(r => r.articolo_id)).size;
    document.getElementById("linkInevasi").textContent = `⏳ Inevasi da mandare alle filiali: ${nInevasi} articoli`;
    // Una sede che non riceve ordini (es. un negozio) non vede la sezione
    if (!lista.length && !nInevasi) document.getElementById("sezRicevuti").hidden = true;
  }).catch(err => avviso("Errore nel leggere gli ordini ricevuti: " + err.message));
</script>
</body>
</html>
