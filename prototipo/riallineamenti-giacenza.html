<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Riallineamenti Giacenza – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
</head>
<body data-page="riallineamenti-giacenza" data-top="elenco">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/movimenti-db.js"></script>
<script>
  // Inventari (riallineamenti giacenza): riallineamento.html. In corso = Provvisorio (si continua a contare), confermato = Definitivo.
  // La differenza di pezzi può essere positiva (merce trovata) o negativa (merce mancante).
  const elenco = avviaElenco({
    titolo: "Riallineamenti Giacenza",
    nuovo: "Nuovo inventario",
    nota: "📋 L'<b>inventario</b>: si sparano tutti i pezzi con la pistola e alla conferma la giacenza diventa quella contata (tutta sull'anno in corso). Mentre un inventario è <b>in corso</b> in questa sede non fare vendite né scarichi.",
    dettaglio: "riallineamento.html",
    nuovoIcona: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    csv: "riallineamenti-giacenza",
    stati: [STATO.provvisorio, STATO.definitivo, STATO.annullato],
    statiBarrati: ["Annullato"],
    statiValidazione: ["Provvisorio"],
    colonne: [
      COL.numero(),
      COL.stato(),
      COL.data("data", "Data"),
      COL.testo("causale", "Causale", 260),
      COL.euro("totArt", "Imp. articoli"),
      COL.euro("tot", "Totale", true),
      COL.differenza("nArt", "Differenza pezzi")
    ],
    dati: []
  });

  // Dopo l'accesso: gli inventari salvati nel database
  dbPronto.then(async db => {
    if (!db) return;
    const righe = await elencoMovimentiDb(db, "riallineamento", ID_SEDI_DB[trovaSede(leggiSede()).nome], "riallineamento.html");
    if (righe.length) elenco.aggiungi(righe);
  }).catch(err => avviso("Errore nel leggere dal database: " + err.message));
</script>
</body>
</html>
