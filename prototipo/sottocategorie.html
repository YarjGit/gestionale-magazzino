<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottocategorie – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  .filtro-cat { display: flex; align-items: center; gap: 10px; }
  .filtro-cat label { font-weight: 600; }
  .filtro-cat select { min-width: 240px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfe; }

  /* Righe di intestazione di gruppo per categoria */
  tr.gruppo td {
    padding: 10px 10px 8px;
    background: #f6f8fb;
    border-bottom: 1px solid var(--line);
  }
  tr.gruppo:hover { background: none; }
  .gruppo-titolo { display: flex; align-items: center; gap: 10px; font-weight: 700; text-transform: uppercase; font-size: 0.82rem; }
  .gruppo-titolo small { font-weight: 500; text-transform: none; color: var(--muted); }
  .lettera {
    display: inline-grid; place-items: center;
    width: 24px; height: 24px;
    border-radius: 7px;
    color: #fff;
    font: 700 0.8rem "JetBrains Mono", monospace;
  }
  .sotto-cod { color: var(--accent); font-weight: 500; }
  tbody tr.voce td:first-child { padding-left: 16px; }
</style>
</head>
<body data-page="sottocategorie">

<template id="top-actions">
  <label class="top-toggle" title="Funzione da definire">
    <input type="checkbox" id="recordAttuali" checked> Record attuali
  </label>
  <span class="spacer"></span>
  <button class="btn btn-primary" id="btnCrea">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nuova sottocategoria
  </button>
</template>

<main class="content">
  <div class="page-head">
    <div>
      <h1 class="page-title">Sottocategorie</h1>
      <div class="crumbs">
        <a href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
        <span>-</span><span>Magazzino</span><span>-</span><a href="categorie.html">Categorie</a><span>-</span><span>Sottocategorie</span>
      </div>
    </div>
  </div>

  <section class="panel">
    <div class="toolbar">
      <div class="tool-group">
        <button title="Aggiorna" id="aggiorna"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button title="Esporta in Excel (CSV)" id="esporta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l6 6M15 13l-6 6"/></svg></button>
      </div>
      <div class="filtro-cat">
        <label for="fCat">Categoria</label>
        <select id="fCat"><option value="">Tutte</option></select>
      </div>
      <div class="cerca">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cerca" type="search" placeholder="Cerca sottocategoria…">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:80px"></th><th>Codice</th><th>Descrizione</th></tr></thead>
        <tbody id="righe"></tbody>
      </table>
    </div>
    <div class="piede"><div class="totali" id="totali"></div></div>
  </section>
</main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/categorie.js"></script>
<script>
  const $ = id => document.getElementById(id);

  CATEGORIE.slice().sort((a, b) => a.descr.localeCompare(b.descr))
    .forEach(c => $("fCat").insertAdjacentHTML("beforeend", `<option value="${c.cod}">${c.cod} – ${c.descr}</option>`));
  // Arrivando da Categorie la categoria è già scelta
  const dalLink = new URLSearchParams(location.search).get("cat");
  if (dalLink && categoria(dalLink)) $("fCat").value = dalLink;

  function filtra() {
    const q = $("cerca").value.trim().toLowerCase();
    return SOTTOCATEGORIE.filter(s =>
      (!$("fCat").value || s.cat === $("fCat").value) &&
      (!q || (s.cod + " " + s.descr).toLowerCase().includes(q)));
  }

  function disegna() {
    const lista = filtra();
    // Raggruppate per categoria, in ordine alfabetico
    const gruppi = CATEGORIE.filter(c => lista.some(s => s.cat === c.cod)).sort((a, b) => a.descr.localeCompare(b.descr));
    $("righe").innerHTML = gruppi.length ? gruppi.map(c => {
      const voci = lista.filter(s => s.cat === c.cod).sort((a, b) => a.descr.localeCompare(b.descr));
      return `<tr class="gruppo"><td colspan="3"><div class="gruppo-titolo">
          <span class="lettera" style="background:${c.colore}">${c.cod}</span>${c.descr}<small>${voci.length} sottocategorie</small>
        </div></td></tr>` +
        voci.map(s => `<tr class="voce">
          <td><div class="azioni">
            <button class="icon-btn" title="Modifica" data-az="Modifica"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
            <button class="icon-btn" title="Vedi articoli" data-az="Vedi articoli"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5v11H3z"/><path d="M9 20v-6h6v6"/></svg></button>
          </div></td>
          <td><span class="sotto-cod">${s.cod}</span></td>
          <td>${s.descr}</td>
        </tr>`).join("");
    }).join("") : '<tr><td colspan="3"><div class="vuoto"><b>Nessuna sottocategoria trovata</b><span>Prova a cambiare categoria o ricerca.</span></div></td></tr>';
    $("totali").innerHTML = `<span>Sottocategorie: <b>${lista.length}</b></span><span>Categorie: <b>${gruppi.length}</b></span>`;
  }

  $("righe").onclick = e => {
    const b = e.target.closest("[data-az]");
    if (b) avviso(`${b.dataset.az} "${b.closest("tr").children[2].textContent}": da costruire`);
  };
  $("fCat").onchange = () => {
    history.replaceState(null, "", $("fCat").value ? `?cat=${$("fCat").value}` : location.pathname);
    disegna();
  };
  $("cerca").oninput = disegna;
  $("aggiorna").onclick = () => { disegna(); avviso("Elenco aggiornato"); };
  $("btnCrea").onclick = () => avviso("Nuova sottocategoria: schermata da costruire");
  $("recordAttuali").onchange = () => avviso("Funzione da definire insieme");
  $("esporta").onclick = () => {
    const csv = [["Categoria", "Codice", "Descrizione"]]
      .concat(filtra().map(s => [categoria(s.cat).descr, s.cod, s.descr]))
      .map(r => r.map(v => `"${v}"`).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "sottocategorie.csv";
    a.click();
  };

  disegna();
</script>
</body>
</html>
