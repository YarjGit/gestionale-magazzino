<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppi di Codici – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<style>
  .lettera { width: 24px; height: 24px; font-size: 0.78rem; margin-right: 8px; }
  .jolly { margin-left: 6px; font-size: 0.7rem; padding: 1px 6px; border-radius: 5px; background: #f1f3f7; color: var(--muted); font-weight: 600; }
</style>
</head>
<body data-page="gruppi-codici" data-top="anagrafica">
<main class="content"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/anagrafica.js"></script>
<script src="js/macro-gruppi.js"></script>
<script>
  // Ogni macro gruppo ha il gruppo "99" (varie) e gruppi numerati 01, 02, …; il gestionale attuale ne ha 230.
  // Qui ne genero alcuni di esempio.
  const quanti = { A: 4, B: 6, E: 2, F: 5, L: 3, Q: 1, R: 4, G: 3, N: 2, D: 2, O: 1 };
  const dati = MACRO_GRUPPI.flatMap(m => {
    const lista = [{ cod: `${m.cod}99`, macro: m.cod, descr: `${m.descr}/${m.cod}99` }];
    for (let i = 1; i < quanti[m.cod]; i++) {
      const n = String(i).padStart(2, "0");
      lista.push({ cod: `${m.cod}${n}`, macro: m.cod, descr: `${m.descr}/${m.cod}${n}` });
    }
    return lista;
  }).map(g => ({ ...g, macroNome: `${g.macro}: ${macroGruppo(g.macro).descr}` }));

  avviaAnagrafica({
    titolo: "Gruppi di Codici",
    sezione: "Configurazione",
    nuovo: "Nuovo gruppo",
    csv: "gruppi-codici",
    pulsanti: [{ label: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Crea gruppi mancanti' }],
    filtri: [{ id: "fMacro", label: "Macro gruppo", campo: "macroNome", opzioni: MACRO_GRUPPI.map(m => `${m.cod}: ${m.descr}`) }],
    azioniRiga: ["Modifica", "Vedi articoli del gruppo"],
    colonne: [
      { k: "cod", t: "Codice", html: r => `<td><a href="#" class="ana-link num-mov" data-az="Modifica" style="display:inline"><span class="id">${r.cod}</span></a>${r.cod.endsWith("99") ? '<span class="jolly" title="Gruppo per gli articoli vari">varie</span>' : ""}</td>` },
      { k: "descr", t: "Descrizione", larg: 360 },
      { k: "macroNome", t: "Macro gruppo", html: r => `<td>${letteraMacro(r.macro)}${macroGruppo(r.macro).descr}</td>` }
    ],
    dati
  });
</script>
</body>
</html>
