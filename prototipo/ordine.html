<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordine – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<link rel="stylesheet" href="css/scheda.css">
<style>
  /* Scelta del fornitore: campo di ricerca invece della tendina lunga */
  .scegli-forn { position: relative; margin-bottom: 12px; }
  .scegli-forn input { width: 100%; padding: 9px 12px 9px 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; }
  .scegli-forn input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,139,255,0.15); }
  .scegli-forn .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .scegli-forn.scelto input { border-color: #9fd8b9; background: #f3fbf6; padding-right: 36px; }
  .togli-forn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted); font-size: 1rem; cursor: pointer; }
  .togli-forn:hover { color: var(--ko); }
  /* Fornitore obbligatorio: campo rosso finché manca */
  .cerca-forn.manca input { border-color: #f1a5a5; background: #fff6f6; }

  /* Articoli del fornitore scelto */
</style>
</head>
<body data-page="ordini-fornitori">

<template id="top-actions">
  <span class="spacer"></span>
  <button class="btn btn-light" id="btnEtichette">🏷️ Etichette movimento</button>
  <div class="dd" id="ddStampa" style="position:relative">
    <button class="btn btn-light" id="btnStampa">🖨️ Stampa ▾</button>
    <div class="row-menu" id="menuStampa" style="right:0;left:auto;top:calc(100% + 6px);position:absolute">
      <button data-az="Ordine">Ordine a fornitore (carta intestata)</button>
      <button data-az="Ordine da inviare al fornitore">Ordine da inviare al fornitore</button>
      <button data-az="Ordine su carta intestata">Ordine su carta intestata</button>
      <button data-az="Elenco articoli">Elenco articoli</button>
    </div>
  </div>
  <button class="btn btn-light" id="btnExcel">📤 Excel</button>
  <button class="btn btn-light" id="btnChiudi">✕ Chiudi</button>
  <button class="btn btn-verde" id="btnModifica">✎ Modifica</button>
  <button class="btn btn-light" id="btnAnnulla" hidden>✕ Annulla</button>
  <button class="btn btn-primary" id="btnSalva" hidden>💾 Salva</button>
  <button class="btn btn-verde" id="btnSalvaChiudi" hidden>✔ Salva e chiudi</button>
</template>

<main class="content" id="contenuto"></main>

<script src="js/sedi.js"></script>
<script src="js/layout.js"></script>
<script src="js/elenco.js"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli-reali.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/dati-carichi.js"></script>
<script src="js/dati-ordini.js"></script>
<script src="js/righe-movimento.js"></script>
<script src="js/movimenti-db.js"></script>
<script type="module">
  // Scheda ordine a fornitore: ?nuovo=1 un ordine vuoto già in modifica; ?db=12 un ordine salvato nel database;
  // ?id=8783 un ordine di esempio. Il fornitore è obbligatorio; scelto il fornitore, gli articoli si aggiungono dal campo "Aggiungi articolo" (ricerca tra i suoi articoli, anche con la pistola).
  // Se il fornitore è una sede (es. MAGAZZINO CENTRALE) l'ordine arriva a quella sede, che lo prepara con un
  // trasferimento; quello che manca resta negli INEVASI. Le righe articolo sono in js/righe-movimento.js.
  // ("module": permette di aspettare il database prima di disegnare un ordine salvato)
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const nuovo = qs.has("nuovo");
  const dbId = +qs.get("db");
  const oggi = new Date().toISOString().slice(0, 10);
  const sedeLavoro = trovaSede(leggiSede()).nome;
  const movDb = dbId ? await dbPronto.then(db => db && leggiMovimentoDb(db, dbId, ID_SEDI_DB[sedeLavoro])).catch(err => { avviso("Errore nel leggere l'ordine: " + err.message); return null; }) : null;
  const ord = nuovo ? null : dbId ? movDb && {
      id: movDb.id, dbId: movDb.id, stato: movDb.stato, data: movDb.data_movimento, prot: movDb.protocollo || "",
      causale: movDb.causale || "", annotazioni: movDb.annotazioni || "", porto: movDb.porto, condPag: movDb.condizione_pagamento,
      numBolla: movDb.numero_documento || "", dataBolla: movDb.data_bolla || "",
      spese: +movDb.spese, creatoDa: movDb.creato_da, creatoIl: movDb.creato_il
    }
    : ORDINI.find(o => o.id === +qs.get("id"));
  // Fornitori: quelli di esempio finché non arrivano quelli del database ({ id, codice, nome, piva, sede })
  let FORN = movDb && movDb.fornitori ? [{ id: movDb.fornitori.id, codice: movDb.fornitori.codice, nome: movDb.fornitori.ragione_sociale, piva: "", sede: null }]
    : FORNITORI.map((nome, i) => ({ id: i, codice: String(600 + i * 9), nome, piva: "" }));
  let fornitore = null;
  // Inevasi della nostra sede verso la sede del fornitore: articolo_id → quanti pezzi sono ancora in attesa
  let inAttesa = new Map();

  if (!nuovo && !ord) {
    $("contenuto").innerHTML = `<div class="panel"><div class="vuoto"><b>Ordine #${esc(qs.get("id") || qs.get("db") || "")} non trovato</b>
      <span><a href="ordini-fornitori.html" style="color:var(--accent)">Torna all'elenco degli ordini</a></span></div></div>`;
    document.querySelectorAll(".top-actions .btn, .top-actions .dd").forEach(b => { if (b.id !== "btnChiudi") b.hidden = true; });
    $("btnChiudi").onclick = () => location.href = "ordini-fornitori.html";
    throw new Error("ordine non trovato");
  }
  document.title = `${nuovo ? "Nuovo ordine" : `Ordine #${ord.id}`} – Gestionale Magazzino`;
  // Stati che si possono scegliere: un ordine evaso, annullato o di riordino resta nel suo stato
  const statiScelta = ["Provvisorio", "Definitivo"].concat(ord && !["Provvisorio", "Definitivo"].includes(ord.stato) ? [ord.stato] : []);

  const opz = (lista, scelto) => lista.map(o => `<option${o === scelto ? " selected" : ""}>${esc(o)}</option>`).join("");
  const campo = (cls, label, html, aiuto) => `<div class="f ${cls}"><label>${label}</label>${html}${aiuto ? `<span class="aiuto">${aiuto}</span>` : ""}</div>`;
  const icoCerca = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  const CFG_RIGHE = { etichettaPrezzo: "Costo", ivaInclusa: false, spedita: false, nelMovimento: "nell'ordine" };

  $("contenuto").innerHTML = `
    <div class="scheda-head">
      <div>
        <h1 class="page-title">${nuovo ? "Nuovo ordine a fornitore" : `Ordine a fornitore <span class="num">#${ord.id}</span>${ord.prot ? ` <span class="num" style="color:var(--muted)">${ord.prot}</span>` : ""}`} <span class="pill" id="pillStato"></span></h1>
        <div class="crumbs">
          <a href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
          <span>-</span><span>Movimenti</span><span>-</span><a href="ordini-fornitori.html">Ordini a Fornitori</a><span>-</span><span>${nuovo ? "Nuovo" : "#" + ord.id}</span>
        </div>
      </div>
      <div class="totale-top">
        <div class="t">Totale ordine</div>
        <div class="v" id="topTotale">${euro(0)}</div>
        <div class="p" id="topPezzi">0 pezzi · 0 righe</div>
      </div>
    </div>
    <div class="banner provv" id="bannerProvv" hidden><span>◷</span><span>L'ordine è <b>provvisorio</b>: si può ancora completare nei prossimi giorni e <b>non viene contato</b> nelle giacenze.<span id="provvSede"></span></span></div>
    ${ord && ord.stato === "Annullato" ? '<div class="banner ann">✕ Questo ordine è annullato: non si può modificare.</div>' : ""}
    <div class="banner mod" id="bannerModifica" hidden>✎ Stai modificando l'ordine. Ricordati di salvare.</div>

    <section class="panel">
      <div class="schede" id="schede">
        <button class="scheda-tab active" data-t="dettagli">📄 Dettagli</button>
        <button class="scheda-tab" data-t="articoli">📦 Articoli <span class="n" id="nRigheTab">0</span></button>
        <button class="scheda-tab" data-t="riordini">🧩 Riordini <span class="n">0</span></button>
        <button class="scheda-tab" data-t="storico">🕑 Storico modifiche</button>
        <span class="spazio"></span>
        <label class="interr" title="Ipotesi: un'etichetta per ogni pezzo invece che una per articolo"><span class="switch"><input type="checkbox" id="barcodeDup" checked><span></span></span> Barcode duplicati</label>
        <label class="interr"><span class="switch"><input type="checkbox" id="ordinaCodice"><span></span></span> Ordina per codice</label>
      </div>

      <!-- DETTAGLI -->
      <div class="pannello-tab" id="tab-dettagli">
        <div class="dettagli">
          <div>
            <div class="gruppo">
              <h3>📄 Documento</h3>
              <div class="campi">
                ${campo("s2", "Tipo di movimento", `<select disabled><option>Ordine a fornitore</option></select>`)}
                ${campo("s4", "Stato movimento", `<div class="stato-sel"><span class="dot" id="dotStato"></span><select class="mod" id="selStato">${opz(statiScelta, ord ? ord.stato : "Definitivo")}</select><button class="btn" id="btnProvv" style="padding:6px 10px;font-size:0.8rem;white-space:nowrap"></button></div>`, "provvisorio = ancora da completare nei prossimi giorni")}
                ${campo("s2", "Aliquota IVA", `<select class="mod">${opz(["22% (A.22)", "10% (A.10)", "4% (A.04)", "Esente (C.--)"], "22% (A.22)")}</select>`)}
                ${campo("s2", "Data ordine", `<input class="mod" id="fData" type="date" value="${ord ? ord.data : oggi}">`)}
                ${campo("s2", "Progressivo", `<input disabled value="${ord && ord.prot ? ord.prot : ""}" placeholder="assegnato al salvataggio">`)}
                ${campo("s2", "Data bolla", `<input class="mod" id="fDataBolla" type="date" value="${ord && ord.dataBolla || ""}">`)}
                ${campo("s2", "Numero bolla", `<input class="mod" id="fNumBolla" value="${esc(ord && ord.numBolla || "")}">`)}
                ${campo("s1", "Porto", `<select class="mod" id="fPorto">${opz(["Franco", "Assegnato"], (ord && ord.porto) || "Franco")}</select>`)}
                ${campo("s1", "Anno", `<input value="${(ord ? ord.data : oggi).slice(0, 4)}" disabled style="text-align:right">`)}
                ${campo("s4", "Riferimento fattura", `<input class="mod">`)}
                ${campo("s2", "ID", `<input value="${ord ? ord.id : ""}" placeholder="nuovo" disabled style="text-align:right">`)}
              </div>
            </div>
            <div class="gruppo">
              <h3>🏭 Fornitore e pagamento</h3>
              <div class="campi">
                ${campo("s4 cerca-forn", 'Fornitore <span style="color:var(--ko)">*</span>', `<div style="position:relative"><input class="mod" id="fornDettagli" placeholder="Obbligatorio: scrivi nome, codice o partita IVA…" autocomplete="off"><div class="suggerimenti" id="suggFornDett"></div></div>`, "senza fornitore l'ordine non va avanti")}
                ${campo("s1", "Sconto %", `<input class="mod" type="number" min="0" max="100" style="text-align:right">`)}
                ${campo("s1", "Parz. evaso", `<label class="interr" style="margin:6px 0 0"><span class="switch"><input class="mod" type="checkbox" id="parzEvaso" ${ord && ord.ricevuti && ord.ricevuti < ord.nArt ? "checked" : ""}><span></span></span></label>`)}
                ${campo("s3", "Ordine padre", `<select disabled><option>— nessuno —</option></select>`, "l'ordine da cui nasce questo (es. un riordino)")}
                ${campo("s3", "Condizione di pagamento", `<select class="mod" id="fCondPag"><option></option>${opz(["Contrassegno", "Già effettuato", "Ricevimento fattura", "Bonifico a 30 gg.", "Bonifico a 60 gg.", "Bonifico a 90 gg."], ord && ord.condPag)}</select>`)}
                ${campo("s3", "Sede che ordina", `<input value="${esc(sedeLavoro)}" disabled>`)}
              </div>
            </div>
            <div class="gruppo">
              <h3>🚚 Spedizione</h3>
              <div class="campi">
                ${campo("s2", "Spedizioniere", `<select class="mod"><option></option>${opz(["Euroitaly", "BRT Corriere Espresso"])}</select>`)}
                ${campo("s2", "Tracking number", `<input class="mod">`)}
                ${campo("s2", "Tempo di consegna", `<input class="mod">`)}
              </div>
            </div>
            <div class="gruppo">
              <h3>📝 Note</h3>
              <div class="campi">
                ${campo("s3", "Causale", `<textarea class="mod" id="fCausale">${esc(ord ? ord.causale : "")}</textarea>`, "non stampata sul documento")}
                ${campo("s3", "Annotazioni", `<textarea class="mod" id="fAnnot">${esc(ord && ord.annotazioni || "")}</textarea>`, "stampate sull'ordine inviato al fornitore")}
              </div>
            </div>
          </div>
          <aside class="riepilogo">
            <h3>Riepilogo importi</h3>
            <div class="voce-imp fissa"><label>+ Totale articoli <small>IVA incl.</small></label><input id="impArticoli" value="0,00" disabled></div>
            ${["Spese", "Spese trasporto", "Spese fisse corriere", "Spese % corriere", "Spese accessorie", "Spese volo"].map((s, i) =>
              `<div class="voce-imp"><label>+ ${s}</label><input class="mod spesa" placeholder="0,00" value="${i === 0 && ord && ord.spese ? numero(ord.spese) : ""}"></div>`).join("")}
            <div class="totale-compl"><span>= Totale complessivo</span><span class="v" id="totCompl">0,00</span></div>
          </aside>
        </div>
      </div>

      <!-- ARTICOLI -->
      <div class="pannello-tab" id="tab-articoli" hidden>
        <div class="scegli-forn cerca-forn" id="boxForn">
          <span class="ico">🏭</span>
          <input class="mod" id="cercaForn" placeholder="Scegli il fornitore: scrivi nome, codice o partita IVA…" autocomplete="off">
          <button class="togli-forn" id="togliForn" title="Togli il fornitore" hidden>✕</button>
          <div class="suggerimenti" id="suggForn"></div>
        </div>

        <div class="box-attesa" id="notaInevasi" hidden></div>
        ${righeHtmlAggiungi(true)}
        <div class="art-toolbar">
          <div class="nota-viola" style="margin:0;flex:1">💶 In questa pagina si indicano i <b>prezzi di acquisto</b>.</div>
          <label class="interr"><span class="switch"><input type="checkbox" id="nuoviInAlto" checked><span></span></span> Nuovi articoli in alto</label>
        </div>
        ${righeHtmlTabella(CFG_RIGHE)}
      </div>

      <div class="pannello-tab" id="tab-riordini" hidden>
        <div class="vuoto"><b>Nessun riordino</b><span>Qui compariranno gli ordini nati dagli articoli di questo ordine che non arrivano.</span></div>
      </div>
      <div class="pannello-tab" id="tab-storico" hidden>
        <div class="vuoto"><b>${nuovo ? "Ordine non ancora salvato" : "Storico da collegare"}</b><span>${nuovo ? "Dopo il salvataggio qui comparirà chi lo ha creato e modificato." : "Arriverà con il salvataggio nel database."}</span></div>
      </div>
    </section>`;

  // ---------- Schede ----------
  $("schede").onclick = e => {
    const b = e.target.closest(".scheda-tab");
    if (!b) return;
    document.querySelectorAll(".scheda-tab").forEach(t => t.classList.toggle("active", t === b));
    document.querySelectorAll(".pannello-tab").forEach(p => p.hidden = p.id !== "tab-" + b.dataset.t);
  };

  // ---------- Stato: "Rendi provvisorio" (blu) lascia l'ordine aperto per completarlo nei giorni dopo;
  // da provvisorio il tasto diventa giallo, "Rendi definitivo", e ricliccandolo si torna indietro ----------
  function mostraStato() {
    const s = Object.values(STATO).find(x => x.nome === $("selStato").value);
    const provv = s.nome === "Provvisorio";
    $("dotStato").style.background = s.colore;
    $("pillStato").style.cssText = `background:${s.colore}1f;color:${s.colore}`;
    $("pillStato").textContent = `${s.icona} ${s.nome}`;
    $("btnProvv").textContent = provv ? "Rendi definitivo" : "Rendi provvisorio";
    $("btnProvv").className = "btn solo-mod " + (provv ? "btn-giallo" : "btn-primary");
    $("btnProvv").hidden = !["Provvisorio", "Definitivo"].includes(s.nome);
    $("bannerProvv").hidden = !provv;
    // ordine a un'altra sede: finché è provvisorio non le arriva
    $("provvSede").innerHTML = fornitore && fornitore.sede ? ` Il <b>${esc(fornitore.nome)}</b> non lo vede finché non lo rendi definitivo.` : "";
  }
  $("selStato").onchange = mostraStato;
  $("btnProvv").onclick = () => {
    $("selStato").value = $("selStato").value === "Definitivo" ? "Provvisorio" : "Definitivo";
    mostraStato();
  };
  mostraStato();

  // ---------- Fornitore (obbligatorio): si sceglie sia in Dettagli sia in cima alla scheda Articoli ----------
  const trovaFornitori = testo => {
    const parole = normalizza(testo).split(/\s+/).filter(Boolean);
    return FORN.filter(f => parole.every(p => normalizza(`${f.codice} ${f.nome} ${f.piva}`).includes(p))).slice(0, 15);
  };
  const nomeFornitore = f => `${f.codice}: ${f.nome}${f.piva ? ` (${f.piva})` : ""}`;
  const articoliDel = f => ARTICOLI.filter(a => a.forn != null && a.forn === f.id);
  const CAMPI_FORN = [["cercaForn", "suggForn"], ["fornDettagli", "suggFornDett"]];
  function mostraSuggForn(campo, box) {
    const lista = trovaFornitori($(campo).value);
    $(box).innerHTML = lista.length
      ? lista.map(f => `<div class="sugg" data-id="${esc(String(f.id))}"><span class="codice">${esc(f.codice)}</span>${esc(f.nome)}${f.piva ? `<span style="color:var(--muted)">&nbsp;· ${esc(f.piva)}</span>` : ""}<small>${articoliDel(f).length} articoli</small></div>`).join("")
      : '<div class="sugg" style="cursor:default;color:var(--muted)">Nessun fornitore trovato</div>';
    $(box).classList.add("show");
  }
  function mostraFornitore() {
    mostraStato();   // l'avviso "provvisorio" dice se il fornitore-sede vede l'ordine
    CAMPI_FORN.forEach(([campo, box]) => { $(campo).value = fornitore ? nomeFornitore(fornitore) : ""; $(box).classList.remove("show"); });
    $("boxForn").classList.toggle("scelto", !!fornitore);
    $("togliForn").hidden = !fornitore || !document.body.classList.contains("in-modifica");
    // senza fornitore i campi diventano rossi e non si possono aggiungere articoli
    document.querySelectorAll(".cerca-forn").forEach(el => el.classList.toggle("manca", !fornitore));
    document.querySelectorAll(".richiede-forn").forEach(el => el.classList.toggle("bloccato", !fornitore));
  }
  function scegliFornitore(f) {
    if (fornitore && righe.RIGHE.length && f !== fornitore && !confirm(`Cambiare fornitore? Le ${righe.RIGHE.length} righe già inserite restano nell'ordine.`)) { mostraFornitore(); return; }
    fornitore = f;
    mostraFornitore();
    righe.disegna();
    aggiornaInAttesa();
  }
  // Fornitore che è una sede (es. Magazzino Centrale): si leggono gli articoli ancora in attesa (inevasi)
  // dei nostri ordini precedenti, così non si riordinano per sbaglio
  let dbConn = null, attesaAperta = true, inAttesaRighe = [];
  // Giacenza del fornitore quando è una sede (es. Magazzino Centrale), per vederla accanto alla nostra
  let giacFornitore = null;
  const nomeSedeFornitore = () => (SEDI.find(s => ID_SEDI_DB[s.nome] === fornitore.sede) || { nome: fornitore.nome }).nome;
  async function aggiornaInAttesa() {
    inAttesa = new Map();
    giacFornitore = null;
    $("notaInevasi").hidden = true;
    if (!dbConn || !fornitore || !fornitore.sede) { righe.disegna(); return; }
    try {
      giacFornitore = await giacenzeSedeDb(dbConn, fornitore.sede);
      const lista = await inevasiDb(dbConn, { sede_richiedente: ID_SEDI_DB[sedeLavoro], sede_fornitrice: fornitore.sede });
      // le righe di questo stesso ordine non contano
      const altri = lista.filter(r => r.ordine_id !== (ord && ord.dbId));
      inAttesaRighe = altri;
      altri.forEach(r => inAttesa.set(r.articolo_id, (inAttesa.get(r.articolo_id) || 0) + r.residuo));
      // Riquadro con tutti gli articoli già in attesa: così non si rimettono nell'ordine
      if (altri.length) {
        const pezzi = Math.round(altri.reduce((t, r) => t + r.residuo, 0) * 100) / 100;
        $("notaInevasi").innerHTML = `
          <div class="testa">⏳ <b>Già in attesa dal ${esc(fornitore.nome)}: ${inAttesa.size} articoli, ${pezzi} pezzi</b>
            <small>sono già messi da parte per voi: <b>non rimetteteli nell'ordine</b>, arrivano da soli</small><span class="spazio"></span>
            <button class="btn btn-light" id="apriAttesa" style="padding:5px 10px;font-size:0.8rem">${attesaAperta ? "Nascondi elenco" : "Mostra elenco"}</button>
            <a class="btn btn-light" href="inevasi.html?vista=attesa" style="padding:5px 10px;font-size:0.8rem">Tutti gli inevasi →</a></div>
          <div class="table-wrap" id="elencoAttesa" ${attesaAperta ? "" : "hidden"}><table>
            <thead><tr><th>Articolo</th><th>Ordine</th><th class="num">In attesa</th></tr></thead>
            <tbody>${altri.map(r => `<tr><td class="art-cella"><span class="codice">${esc(r.articolo.codice)}</span><b>${esc(r.articolo.descr)}</b></td>
              <td style="white-space:nowrap">#${r.ordine_id} <small style="color:var(--muted)">del ${dataIt(r.data_ordine)}${r.stato_ordine === "Definitivo" ? " · non ancora preparato" : ""}</small></td>
              <td class="num"><span class="q-attesa">${r.residuo}</span></td></tr>`).join("")}</tbody></table></div>`;
        $("notaInevasi").hidden = false;
        $("apriAttesa").onclick = () => { attesaAperta = !attesaAperta; aggiornaInAttesa(); };
      }
    } catch (err) { avviso("Errore nel leggere gli inevasi: " + err.message); }
    righe.disegna();
  }
  function serveFornitore() {
    if (fornitore) return true;
    avviso("Prima scegli il fornitore: è obbligatorio");
    $(document.querySelector(".scheda-tab.active").dataset.t === "dettagli" ? "fornDettagli" : "cercaForn").focus();
    return false;
  }
  $("togliForn").onclick = () => { scegliFornitore(null); $("cercaForn").focus(); };
  CAMPI_FORN.forEach(([campo, box]) => {
    $(campo).onfocus = () => { $(campo).select(); mostraSuggForn(campo, box); };
    $(campo).oninput = () => mostraSuggForn(campo, box);
    $(campo).onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); const f = trovaFornitori($(campo).value)[0]; if (f) scegliFornitore(f); }
      if (e.key === "Escape") { $(box).classList.remove("show"); mostraFornitore(); }
    };
    // uscendo dal campo senza scegliere, torna il fornitore scelto (o vuoto)
    $(campo).onblur = () => setTimeout(() => { if (!$(box).matches(":hover")) mostraFornitore(); }, 150);
    $(box).onclick = e => {
      const s = e.target.closest(".sugg[data-id]");
      if (s) scegliFornitore(FORN.find(f => String(f.id) === s.dataset.id));
    };
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".cerca-forn")) ["suggForn", "suggFornDett"].forEach(id => $(id).classList.remove("show"));
  });

  // ---------- Righe dell'ordine (prezzo = costo d'acquisto, IVA aggiunta al totale) ----------
  const righe = avviaRighe({
    ...CFG_RIGHE,
    prezzoDi: art => art.costo,
    giacenzaNeiSuggerimenti: true,
    // ordinando a un'altra sede (es. Magazzino Centrale) si vede anche quanti pezzi ha lei
    giacenzaAltra: art => giacFornitore && art.id ? { sigla: siglaSede(nomeSedeFornitore()), q: giacFornitore.get(art.id) ?? 0 } : null,
    sedeEstera: () => trovaSede(leggiSede()).estera,
    puoAggiungere: serveFornitore,
    altroFornitore: art => !!fornitore && art.forn !== fornitore.id,
    notaArticolo: art => inAttesa.get(art.id) ? `già in attesa: ${inAttesa.get(art.id)}` : "",
    fermaArticolo: (art, n, procedi) => {
      if (!inAttesa.get(art.id)) return false;
      chiediAttesa(art, n, procedi);
      return true;
    },
    testoVuoto: () => fornitore ? "Scrivi almeno 2 caratteri in \"Aggiungi articolo\" e scegli tra i suggerimenti, oppure spara il barcode con la pistola." : "Scegli prima il fornitore: compariranno i suoi articoli.",
    cambiato: () => ricalcola()
  });

  // ---------- Articolo già in attesa: si spiega e si chiede (Invio = "Va bene, non lo aggiungo") ----------
  document.body.insertAdjacentHTML("beforeend", `
    <div class="modal-bg" id="modAttesa"><div class="modal" style="width:min(520px,100%)">
      <h2>⏳ Questo articolo è già in attesa</h2>
      <p id="modAttesaTesto"></p>
      <div id="modAttesaRighe" style="margin-bottom:14px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn btn-light" id="modPiu" title="Servono altri pezzi oltre a quelli già in attesa">➕ Ne servono di più</button>
        <button class="btn btn-primary" id="modOk">✔ Va bene, non lo aggiungo</button>
      </div>
    </div></div>`);
  let procediAttesa = null;
  function chiediAttesa(art, n, procedi) {
    const quali = inAttesaRighe.filter(r => r.articolo_id === art.id);
    $("modAttesaTesto").innerHTML = `<b>${esc(art.codice)} – ${esc(art.descr)}</b>: dal ${esc(fornitore.nome)} ne aspettate già <b>${inAttesa.get(art.id)}</b>.
      Sono già messi da parte per voi e arriveranno da soli: <b>non serve riordinarlo</b>.`;
    $("modAttesaRighe").innerHTML = quali.map(r => `<div style="padding:6px 10px;border-radius:8px;background:#f1ecff;color:#4a2aa8;margin-top:6px">Ordine #${r.ordine_id} del ${dataIt(r.data_ordine)}: <b>${r.residuo} in attesa</b>${r.stato_ordine === "Definitivo" ? " (non ancora preparato)" : ""}</div>`).join("");
    procediAttesa = procedi;
    $("modAttesa").classList.add("show");
    $("modOk").focus();
  }
  function chiudiAttesa() {
    $("modAttesa").classList.remove("show");
    $("addArt").value = ""; $("suggArt").classList.remove("show");
    $("addArt").focus();
  }
  $("modOk").onclick = () => { chiudiAttesa(); avviso("Non aggiunto: è già in attesa"); };
  $("modPiu").onclick = () => {
    chiudiAttesa();
    if (procediAttesa) procediAttesa();   // la riga si vede con "IN PIÙ": il Magazzino Centrale sa che sono pezzi in aggiunta
  };

  // ---------- Totali in alto e riepilogo ----------
  const num = s => +String(s).replace(/\./g, "").replace(",", ".") || 0;
  function ricalcola() {
    const tot = righe.totale();
    const spese = [...document.querySelectorAll(".spesa")].reduce((s, i) => s + num(i.value), 0);
    $("impArticoli").value = numero(tot);
    $("totCompl").textContent = numero(tot + spese);
    $("topTotale").textContent = euro(tot);
    $("topPezzi").textContent = `${righe.pezzi()} pezzi · ${righe.RIGHE.length} righe`;
    $("nRigheTab").textContent = righe.RIGHE.length;
  }
  document.querySelectorAll(".spesa").forEach(i => i.oninput = ricalcola);

  // ---------- Pulsanti in alto ----------
  function controlla() {
    if (!serveFornitore()) return false;
    if (righe.senzaArticolo()) { avviso("C'è una riga senza articolo: scegli l'articolo o eliminala con il cestino"); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    if (!righe.RIGHE.length) { avviso("Aggiungi almeno un articolo all'ordine"); return false; }
    return true;
  }
  // Modifica sblocca i campi; Annulla rimette i valori di prima, Salva torna in sola lettura.
  // Un ordine evaso (già preparato dalla sede che lo riceve) o annullato non si modifica più.
  const annullato = ord && ["Annullato", "Evaso"].includes(ord.stato);
  const pulsantiLettura = ["btnEtichette", "ddStampa", "btnExcel", "btnChiudi", "btnModifica"];
  let valoriPrima = [], righePrima = [], fornitorePrima = null;
  function modalita(modifica) {
    document.body.classList.toggle("in-modifica", modifica);
    document.querySelectorAll(".mod").forEach(el => el.disabled = !modifica);
    pulsantiLettura.forEach(id => $(id).hidden = modifica || (id === "btnModifica" && annullato));
    ["btnAnnulla", "btnSalva", "btnSalvaChiudi"].forEach(id => $(id).hidden = !modifica);
    $("bannerModifica").hidden = !modifica || nuovo;
    mostraFornitore();
    righe.disegna();
  }
  $("btnModifica").onclick = () => {
    valoriPrima = [...document.querySelectorAll(".mod")].map(el => el.type === "checkbox" ? el.checked : el.value);
    righePrima = righe.fotografia();
    fornitorePrima = fornitore;
    modalita(true);
  };
  $("btnAnnulla").onclick = () => {
    if (nuovo) {
      if (!righe.RIGHE.length || confirm("Uscire senza salvare il nuovo ordine?")) location.href = "ordini-fornitori.html";
      return;
    }
    document.querySelectorAll(".mod").forEach((el, i) => el.type === "checkbox" ? el.checked = valoriPrima[i] : el.value = valoriPrima[i]);
    righe.ripristina(righePrima);
    fornitore = fornitorePrima;
    mostraStato(); ricalcola(); modalita(false);
  };
  // Salvataggio nel database (ordine nuovo o già salvato). Definitivo = ordine inviato: se il fornitore è una sede
  // (es. Magazzino Centrale) l'ordine compare a quella sede. Gli ordini di esempio non si salvano.
  async function salva(chiudi) {
    if (!controlla()) return;
    if (!nuovo && !ord.dbId) { avviso("Questo è un ordine di esempio: le modifiche non si salvano"); modalita(false); return; }
    const db = await dbPronto;
    if (!db) { avviso("Per salvare serve l'accesso al database"); return; }
    if (!/^[0-9a-f-]{36}$/i.test(String(fornitore.id))) { avviso("I fornitori veri non sono ancora arrivati dal database: aspetta un attimo e riprova"); return; }
    if (righe.RIGHE.some(r => !r.articolo.id)) { avviso("Ci sono articoli di esempio: ricarica la pagina per usare quelli del database"); return; }
    // Articoli già in attesa (inevasi): il gestionale avvisa e lascia decidere
    const doppi = righe.RIGHE.filter(r => inAttesa.get(r.articolo.id) && !r.oltreAttesa);
    if (doppi.length && !confirm(`Questi articoli sono già in attesa dal ${fornitore.nome} (inevasi di ordini precedenti):\n\n` +
        doppi.map(r => `• ${r.articolo.codice} – ${r.articolo.descr}: ${inAttesa.get(r.articolo.id)} in attesa, ora ne ordini ${r.qta}`).join("\n") +
        `\n\nOK = ordinali lo stesso (si aggiungono a quelli in attesa)\nAnnulla = torna all'ordine per toglierli o cambiare le quantità`)) {
      document.querySelector('.scheda-tab[data-t="articoli"]').click();
      return;
    }
    const testo = id => $(id).value.trim() || null;
    const mov = {
      tipo: "ordine_fornitore", stato: $("selStato").value, sede_id: ID_SEDI_DB[sedeLavoro], fornitore_id: fornitore.id,
      data_movimento: $("fData").value || oggi, data_documento: $("fData").value || oggi,
      causale: testo("fCausale"), annotazioni: testo("fAnnot"), porto: $("fPorto").value, condizione_pagamento: $("fCondPag").value || null,
      numero_documento: testo("fNumBolla"), data_bolla: $("fDataBolla").value || null,
      spese: Math.round([...document.querySelectorAll(".spesa")].reduce((s, i) => s + num(i.value), 0) * 100) / 100
    };
    const pulsanti = ["btnSalva", "btnSalvaChiudi"].map($);
    pulsanti.forEach(b => b.disabled = true);
    try {
      const id = await salvaMovimentoDb(db, mov, righe.RIGHE.map(r => ({
        articolo_id: r.articolo.id, quantita: r.qta, prezzo: r.prezzo, sconto: r.sconto || 0, etichette: 0
      })), ord && ord.dbId);
      avviso(mov.stato === "Definitivo" && fornitore.sede ? `Ordine inviato: il ${fornitore.nome} lo trova nella sua Dashboard`
        : mov.stato === "Definitivo" ? "Ordine salvato" : fornitore.sede ? `Ordine salvato come provvisorio: il ${fornitore.nome} non lo vede finché non lo rendi definitivo` : "Ordine salvato come provvisorio: si può completare nei prossimi giorni");
      setTimeout(() => location.replace(chiudi ? "ordini-fornitori.html" : `ordine.html?db=${id}`), 900);
    } catch (err) {
      avviso("Errore nel salvare l'ordine: " + err.message);
      pulsanti.forEach(b => b.disabled = false);
    }
  }
  $("btnSalva").onclick = () => salva(false);
  $("btnSalvaChiudi").onclick = () => salva(true);
  $("btnChiudi").onclick = () => location.href = "ordini-fornitori.html";
  $("btnEtichette").onclick = () => avviso("Etichette dell'ordine: le definiamo insieme (di solito si stampano al carico della merce)");
  $("btnExcel").onclick = () => righe.excel(`ordine-${ord ? ord.id : "nuovo"}.csv`);
  $("btnStampa").onclick = e => { e.stopPropagation(); $("menuStampa").classList.toggle("show"); };
  $("menuStampa").onclick = e => {
    const b = e.target.closest("button");
    if (b) b.dataset.az === "Ordine" ? stampaOrdine() : avviso(`${b.dataset.az}: da definire insieme`);
    $("menuStampa").classList.remove("show");
  };

  // ---------- Stampa dell'ordine su carta intestata (stampa-documento.html), come quella del gestionale attuale ----------
  // Importo di riga IVA inclusa; in alto a destra il fornitore con indirizzo e telefono (database/19-indirizzi-fornitori.sql)
  async function stampaOrdine() {
    const lista = righe.RIGHE.filter(r => r.articolo && r.qta > 0);
    if (!lista.length) { avviso("Non ci sono articoli da stampare"); return; }
    if (!fornitore) { avviso("Scegli prima il fornitore"); return; }
    const db = await dbPronto;
    let forn = null;
    const unita = new Map();
    if (db) {
      if (/^[0-9a-f-]{36}$/i.test(fornitore.id)) forn = (await db.from("fornitori").select("*").eq("id", fornitore.id).maybeSingle()).data;
      const ids = lista.map(r => r.articolo.id).filter(Boolean);
      if (ids.length) ((await db.from("articoli").select("id, unita_misura").in("id", ids)).data || []).forEach(a => unita.set(a.id, a.unita_misura));
    }
    const data = $("fData").value || oggi, anno = data.slice(0, 4);
    const pezzi = r => (+r.qta).toLocaleString("it-IT", { maximumFractionDigits: 2 }) + (unita.get(r.articolo.id) === "Metri" ? " mt" : "");
    // Importo di riga arrotondato ai 5 centesimi (es. 165,01 → 165,00); i totali sommano gli importi arrotondati
    const importo = r => Math.round(r.tot * 20 + 1e-6) / 20;
    const totArt = Math.round(lista.reduce((s, r) => s + importo(r), 0) * 100) / 100;
    const spese = Math.round([...document.querySelectorAll(".spesa")].reduce((s, i) => s + num(i.value), 0) * 100) / 100;
    // Numero come nel gestionale attuale: progressivo/anno (senza progressivo, l'id dell'ordine)
    const numeroOrd = ord && ord.prot ? (/^\d{4}-0*(\d+)$/.test(ord.prot) ? ord.prot.replace(/^(\d{4})-0*(\d+)$/, "$2/$1") : ord.prot) : ord ? `${ord.id}/${anno}` : "";
    const dati = {
      titolo: "Ordine a Fornitore", sede: sedeLavoro,
      info: [["Data", dataIt(data)]].concat(numeroOrd ? [["Numero", numeroOrd]] : [], $("fNumBolla").value ? [["N. Bolla", $("fNumBolla").value]] : [],
        $("fDataBolla").value ? [["Data Bolla", dataIt($("fDataBolla").value)]] : []),
      destinatario: [forn ? forn.ragione_sociale : fornitore.nome].concat(forn ? [forn.indirizzo, [forn.cap, forn.citta, forn.provincia ? `(${forn.provincia})` : ""].filter(Boolean).join(" "),
        forn.telefono ? "Telefono: " + forn.telefono : ""].filter(Boolean) : []),
      colonne: [{ k: "n", t: "#" }, { k: "cod", t: "Codice", cod: true }, { k: "descr", t: "Descrizione" }, { k: "qta", t: "Quantità", num: true },
        { k: "prezzo", t: "Pr. Unit.", num: true }, { k: "sconto", t: "Sconto %", num: true }, { k: "iva", t: "IVA", num: true }, { k: "importo", t: "Importo", num: true }],
      righe: lista.map((r, i) => ({ n: i + 1, cod: r.articolo.codice, descr: r.articolo.descr, qta: pezzi(r), prezzo: numero(r.prezzo),
        sconto: r.sconto ? (+r.sconto).toLocaleString("it-IT", { maximumFractionDigits: 2 }) : "", iva: percIva(r.iva) + "%", importo: numero(importo(r)) })),
      totali: [["Totale Articoli", numero(totArt)]].concat(spese ? [["+ Spese", numero(spese)]] : [], [["= Totale Complessivo", numero(totArt + spese)]]),
      ritorno: location.pathname.split("/").pop() + location.search
    };
    sessionStorage.setItem("stampa", JSON.stringify(dati));
    location.href = "stampa-documento.html?auto=1";
  }
  document.addEventListener("click", () => $("menuStampa").classList.remove("show"));

  // Ordine esistente: fornitore e righe di esempio (articoli veri dell'anagrafica, totale che torna al centesimo).
  // Il totale dell'elenco è IVA inclusa: il costo unitario si ricava togliendo l'IVA della riga.
  if (movDb) {
    // ordine salvato: fornitore e righe dal database
    fornitore = FORN[0] || null;
    righe.carica(movDb.righe.map(r => ({ qta: +r.quantita, prezzo: +r.prezzo, sconto: +r.sconto, articolo: r.articolo })));
  } else if (ord) {
    fornitore = FORN[ord.cp];
    righe.carica(righeCarico({ ...ord, totArt: ord.tot }).map(r => {
      const iva = ivaDiArticolo(r.articolo);
      return { qta: r.qta, iva, articolo: r.articolo, tot: r.tot, prezzo: Math.round(r.prezzo / (1 + percIva(iva) / 100) * 100) / 100 };
    }));
  }
  ricalcola();
  modalita(nuovo);
  // anche l'ordine nuovo parte dalla scheda Dettagli, con il cursore sul fornitore
  if (nuovo) $("fornDettagli").focus();

  // Dopo l'accesso: fornitori e articoli veri dal database
  dbPronto.then(async db => {
    if (!db) return;
    dbConn = db;
    const [{ data, error }] = await Promise.all([
      db.from("fornitori").select("id, codice, ragione_sociale, partita_iva, sede_collegata").order("ragione_sociale"),
      caricaArticoliDalDb(db, ID_SEDI_DB[sedeLavoro])
    ]);
    if (error) throw error;
    FORN = data.map(f => ({ id: f.id, codice: f.codice, nome: f.ragione_sociale, piva: f.partita_iva || "", sede: f.sede_collegata }));
    // Ordine salvato: lo stesso fornitore, ora con tutti i dati; gli ordini di esempio tengono il loro
    if (movDb) { fornitore = FORN.find(f => f.id === movDb.fornitore_id) || fornitore; mostraFornitore(); aggiornaInAttesa(); return; }
    if (!nuovo) { righe.disegna(); return; }
    // le scelte fatte con i dati di esempio non valgono più
    fornitore = null; mostraFornitore();
    righe.carica([]);
    ricalcola();
  }).catch(err => avviso("Errore nel leggere fornitori e articoli: " + err.message));
</script>
</body>
</html>
