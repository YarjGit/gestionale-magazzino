<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-180.png">
<title>Vendita giornaliera – Gestionale Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/elenco.css">
<link rel="stylesheet" href="css/scheda.css">
<style>
  /* Le vendite indicano i prezzi di vendita: nota verde invece che viola */
  .nota-verde { padding: 9px 12px; border: 1px solid #9fd8b9; border-radius: 9px; background: #effaf3; color: #13804a; font-size: 0.86rem; }
</style>
</head>
<body data-page="vendite-giornaliere">

<template id="top-actions">
  <span class="spacer"></span>
  <div class="dd" id="ddStampa" style="position:relative">
    <button class="btn btn-light" id="btnStampa">🖨️ Stampa ▾</button>
    <div class="row-menu" id="menuStampa" style="right:0;left:auto;top:calc(100% + 6px);position:absolute">
      <button data-az="Riepilogo della giornata">Riepilogo della giornata</button>
      <button data-az="Elenco articoli venduti">Elenco articoli venduti</button>
    </div>
  </div>
  <button class="btn btn-light" id="btnExcel">📤 Excel</button>
  <button class="btn btn-light" id="btnChiudi">✕ Chiudi</button>
  <button class="btn btn-verde" id="btnModifica">✎ Modifica</button>
  <button class="btn btn-light" id="btnAnnulla" hidden>✕ Annulla</button>
  <button class="btn btn-primary" id="btnSalva" hidden>💾 Salva</button>
  <button class="btn btn-verde" id="btnSalvaChiudi" hidden>✔ Salva e chiudi</button>
</template>

<main class="content" id="contenuto"></main>

<!-- Giornata dello stesso giorno già creata: si riapre quella, oppure se ne fa un'altra con una nota obbligatoria -->
<div id="finDoppia" style="position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,50,0.45)">
  <div style="width:min(480px,100%);padding:22px;border-radius:14px;background:#fff;box-shadow:0 20px 60px rgba(20,30,50,0.3)">
    <h3 id="doppiaTitolo" style="margin-bottom:8px;font-size:1.05rem"></h3>
    <p id="doppiaTesto" style="margin-bottom:14px;color:var(--muted);line-height:1.45"></p>
    <div id="doppiaNotaBox" hidden>
      <label for="doppiaNota" style="font-size:0.8rem;font-weight:600;color:var(--muted)">Nota per distinguerla dall'altra <span style="color:var(--ko)">*</span></label>
      <textarea id="doppiaNota" rows="2" placeholder="es. vendite del pomeriggio, ordine telefonico, fiera…" style="width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit"></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
      <button class="btn btn-light" id="doppiaNo">No</button>
      <button class="btn btn-primary" id="doppiaSi">Sì, riapri quelle di oggi</button>
      <button class="btn btn-primary" id="doppiaCrea" hidden>Crea un'altra giornata</button>
    </div>
  </div>
</div>

<script src="js/sedi.js"></script>
<script src="js/layout.js?v=20261126b"></script>
<script src="js/intestazioni.js"></script>
<script src="js/excel.js"></script>
<script src="js/elenco.js?v=20261126b"></script>
<script src="js/dati-esempio.js"></script>
<script src="js/dati-articoli-reali.js"></script>
<script src="js/dati-articoli.js"></script>
<script src="js/dati-carichi.js"></script>
<script src="js/dati-vendite.js"></script>
<script src="js/righe-movimento.js"></script>
<script src="js/movimenti-db.js?v=20261126b"></script>
<script type="module">
  // Scheda vendita giornaliera: lo scarico di magazzino del venduto di un giorno.
  // ?nuovo=1 giornata nuova già in modifica · ?db=12 giornata salvata nel database · ?id=20261021 esempio (non si salva).
  // Le righe usano i prezzi di vendita (IVA inclusa, come sull'etichetta). Righe in js/righe-movimento.js.
  // Definitiva = i pezzi escono subito dalla giacenza della sede.
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const nuovo = qs.has("nuovo");
  const dbId = +qs.get("db");
  const oggi = new Date().toISOString().slice(0, 10);
  const sedeLavoro = trovaSede(leggiSede()).nome;
  // Giornata salvata: si legge dal database prima di disegnare
  const movDb = dbId ? await dbPronto.then(db => db && leggiMovimentoDb(db, dbId, ID_SEDI_DB[sedeLavoro]))
    .catch(err => { avviso("Errore nel leggere la giornata: " + err.message); return null; }) : null;
  const ven = nuovo ? null : movDb ? { id: movDb.id, dbId: movDb.id, stato: movDb.stato, data: movDb.data_movimento, causale: movDb.causale || "", annotazioni: movDb.annotazioni || "", spese: +movDb.spese }
    : dbId ? null : VENDITE.find(v => v.id === +qs.get("id"));

  if (!nuovo && !ven) {
    $("contenuto").innerHTML = `<div class="panel"><div class="vuoto"><b>Giornata #${esc(dbId || qs.get("id") || "")} non trovata</b>
      <span><a href="vendite-giornaliere.html" style="color:var(--accent)">Torna all'elenco delle vendite</a></span></div></div>`;
    document.querySelectorAll(".top-actions .btn, .top-actions .dd").forEach(b => { if (b.id !== "btnChiudi") b.hidden = true; });
    $("btnChiudi").onclick = () => location.href = "vendite-giornaliere.html";
    throw new Error("vendita non trovata");
  }
  const giornoIt = d => d.split("-").reverse().join("/");
  // Vendite e-commerce: una giornata a parte per ogni giorno (?nuovo=1&canale=ecommerce), riconosciuta dalla causale "E-COMMERCE …".
  // Nel gestionale attuale era un trasferimento alla Sede Centrale aperto a inizio mese e riempito per tutto il mese:
  // le righe aggiunte dopo prendevano la data della scheda e la giacenza andava sotto zero nello storico.
  const ECOM = nuovo ? qs.get("canale") === "ecommerce" : /^E-?COMMERCE/i.test(ven.causale || "");
  const NOME_G = ECOM ? "Vendite e-commerce" : "Vendite";
  const causaleDi = g => ECOM ? `E-COMMERCE – vendite online del ${giornoIt(g)}` : `Riepilogo vendite giornaliere del ${giornoIt(g)}`;
  document.title = `${nuovo ? (ECOM ? "Nuova giornata e-commerce" : "Nuova giornata") : `${NOME_G} del ${giornoIt(ven.data)}`} – Gestionale Magazzino`;

  const opz = (lista, scelto) => lista.map(o => `<option${o === scelto ? " selected" : ""}>${esc(o)}</option>`).join("");
  const campo = (cls, label, html, aiuto) => `<div class="f ${cls}"><label>${label}</label>${html}${aiuto ? `<span class="aiuto">${aiuto}</span>` : ""}</div>`;
  // Come nel gestionale attuale: Ordinata resta vuota, la quantità venduta va in Spedita
  // Non si vende più di quanto c'è in giacenza nella sede (limiteGiacenza).
  // E-commerce: ogni vendita aggiunta durante il giorno è una riga a sé con la sua ora (righeSeparate)
  const CFG_RIGHE = { etichettaPrezzo: "Prezzo", ivaInclusa: true, spedita: true, soloSpedita: true, nelMovimento: "nella giornata", limiteGiacenza: true, righeSeparate: ECOM };
  const ELENCO_V = ECOM ? "vendite-giornaliere.html?canale=ecommerce" : "vendite-giornaliere.html";

  $("contenuto").innerHTML = `
    <div class="scheda-head">
      <div>
        <h1 class="page-title">${nuovo ? (ECOM ? "Nuova giornata di vendite e-commerce" : "Nuova giornata di vendite") : `${NOME_G} del <span class="num">${giornoIt(ven.data)}</span>`}${ECOM ? ' <span class="pill" style="background:#7c3aed1f;color:#7c3aed">🛒 e-commerce</span>' : ""} <span class="pill" id="pillStato"></span></h1>
        <div class="crumbs">
          <a href="dashboard.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></a>
          <span>-</span><span>Movimenti</span><span>-</span><a href="${ELENCO_V}">${ECOM ? "Vendite e-commerce" : "Vendite Giornaliere"}</a><span>-</span><span>${nuovo ? "Nuova" : giornoIt(ven.data)}</span>
        </div>
      </div>
      <div class="totale-top">
        <div class="t">Totale venduto</div>
        <div class="v" id="topTotale">${euro(0)}</div>
        <div class="p" id="topPezzi">0 pezzi · 0 righe</div>
      </div>
    </div>
    <div class="banner provv" id="bannerProvv" hidden><span>◷</span><span>La giornata è <b>provvisoria</b>: si può ancora completare e <b>non viene scaricata</b> dalle giacenze.</span></div>
    ${ven && ven.stato === "Annullato" ? '<div class="banner ann">✕ Questa giornata è annullata: non scarica le giacenze e non si può modificare.</div>' : ""}
    <div class="banner mod" id="bannerModifica" hidden>✎ Stai modificando la giornata. Ricordati di salvare.</div>
    ${ECOM ? `<div class="banner" style="background:#f5f0ff;border:1px solid #cdb8f5;color:#5b21b6">🛒 <span>Vendite <b>online</b> di <b>un solo giorno</b>: la merce esce dalla giacenza di ${esc(sedeLavoro)} con la data della vendita. Il giorno dopo se ne fa una nuova: mai righe aggiunte a una giornata vecchia.</span></div>` : ""}
    <div class="banner provv" id="bannerGiaOggi" hidden><span>📅</span><span></span></div>
    <div class="banner provv" id="bannerVecchia" hidden><span>⚠</span><span>Questa giornata è del <b>${ven ? giornoIt(ven.data) : ""}</b>: aggiungi qui solo articoli venduti <b>quel giorno</b>. Le vendite di oggi vanno nella giornata di oggi: <a id="linkOggi" href="vendita.html?nuovo=1${ECOM ? "&canale=ecommerce" : ""}" style="color:inherit;font-weight:700">aprila →</a></span></div>

    <section class="panel">
      <div class="schede" id="schede">
        <button class="scheda-tab" data-t="dettagli">📄 Dettagli</button>
        <button class="scheda-tab active" data-t="articoli">📦 Articoli <span class="n" id="nRigheTab">0</span></button>
        <button class="scheda-tab" data-t="riordini">🧩 Riordini <span class="n">0</span></button>
        <button class="scheda-tab" data-t="storico">🕑 Storico modifiche</button>
        <span class="spazio"></span>
        <label class="interr"><span class="switch"><input type="checkbox" id="ordinaCodice"><span></span></span> Ordina per codice</label>
      </div>

      <!-- DETTAGLI -->
      <div class="pannello-tab" id="tab-dettagli" hidden>
        <div class="dettagli">
          <div>
            <div class="gruppo">
              <h3>📄 Giornata</h3>
              <div class="campi">
                ${campo("s2", "Tipo di movimento", `<select disabled><option>${ECOM ? "Vendita e-commerce" : "Vendita giornaliera"}</option></select>`)}
                ${campo("s4", "Stato movimento", `<div class="stato-sel"><span class="dot" id="dotStato"></span><select class="mod" id="selStato">${opz(["Provvisorio", "Definitivo"].concat(ven && ven.stato === "Annullato" ? ["Annullato"] : []), ven ? ven.stato : "Definitivo")}</select><button class="btn" id="btnProvv" style="padding:6px 10px;font-size:0.8rem;white-space:nowrap"></button></div>`, "provvisoria = ancora da completare")}
                ${campo("s2", "Giorno", `<input class="mod" type="date" id="giorno" value="${ven ? ven.data : oggi}">`)}
                ${campo("s2", "Sede", `<input value="${esc(sedeLavoro)}" disabled>`)}
                ${campo("s1", "Anno", `<input value="${(ven ? ven.data : oggi).slice(0, 4)}" disabled style="text-align:right">`)}
                ${campo("s1", "ID", `<input value="${ven && ven.dbId ? ven.id : ""}" placeholder="${ven ? "esempio" : "nuovo"}" disabled style="text-align:right">`)}
              </div>
            </div>
            <div class="gruppo">
              <h3>📝 Note</h3>
              <div class="campi">
                ${campo("s3", "Causale", `<textarea class="mod" id="causale">${esc(ven ? ven.causale : causaleDi(oggi))}</textarea>`, "non stampata sul documento")}
                ${campo("s3", "Annotazioni", `<textarea class="mod" id="annotazioni">${esc(ven ? ven.annotazioni || "" : "")}</textarea>`, "stampate sul riepilogo")}
              </div>
            </div>
          </div>
          <aside class="riepilogo">
            <h3>Riepilogo importi</h3>
            <div class="voce-imp fissa"><label>+ Totale articoli <small>IVA incl.</small></label><input id="impArticoli" value="0,00" disabled></div>
            <div class="voce-imp"><label>+ Spese</label><input class="mod spesa" placeholder="0,00" value="${ven && ven.spese ? numero(ven.spese) : ""}"></div>
            <div class="totale-compl"><span>= Totale complessivo</span><span class="v" id="totCompl">0,00</span></div>
          </aside>
        </div>
      </div>

      <!-- ARTICOLI -->
      <div class="pannello-tab" id="tab-articoli">
        ${righeHtmlAggiungi()}
        <div class="art-toolbar">
          <div class="nota-verde" style="flex:1">🏷️ In questa pagina si indicano i <b>prezzi di vendita</b> (IVA inclusa, come sull'etichetta).</div>
          <label class="interr"><span class="switch"><input type="checkbox" id="nuoviInAlto" checked><span></span></span> Nuovi articoli in alto</label>
        </div>
        ${righeHtmlTabella(CFG_RIGHE)}
      </div>

      <div class="pannello-tab" id="tab-riordini" hidden>
        <div class="vuoto"><b>Nessun riordino</b><span>Qui compariranno gli ordini per ricomprare quello che è stato venduto (da definire insieme).</span></div>
      </div>
      <div class="pannello-tab" id="tab-storico" hidden>
        <div class="vuoto"><b>${nuovo ? "Giornata non ancora salvata" : "Storico da collegare"}</b><span>${nuovo ? "Dopo il salvataggio qui comparirà chi l'ha creata e modificata." : "Arriverà con il salvataggio nel database."}</span></div>
      </div>
    </section>`;

  // ---------- Schede ----------
  $("schede").onclick = e => {
    const b = e.target.closest(".scheda-tab");
    if (!b) return;
    document.querySelectorAll(".scheda-tab").forEach(t => t.classList.toggle("active", t === b));
    document.querySelectorAll(".pannello-tab").forEach(p => p.hidden = p.id !== "tab-" + b.dataset.t);
  };

  // ---------- Stato: "Rendi provvisorio" (blu) / "Rendi definitivo" (giallo), come negli ordini ----------
  function mostraStato() {
    const s = Object.values(STATO).find(x => x.nome === $("selStato").value);
    const provv = s.nome === "Provvisorio";
    $("dotStato").style.background = s.colore;
    $("pillStato").style.cssText = `background:${s.colore}1f;color:${s.colore}`;
    $("pillStato").textContent = `${s.icona} ${s.nome}`;
    $("btnProvv").textContent = provv ? "Rendi definitivo" : "Rendi provvisorio";
    $("btnProvv").className = "btn solo-mod " + (provv ? "btn-giallo" : "btn-primary");
    $("btnProvv").hidden = !["Provvisorio", "Definitivo"].includes(s.nome);
    $("bannerProvv").hidden = !provv;
  }
  $("selStato").onchange = mostraStato;
  $("btnProvv").onclick = () => {
    $("selStato").value = $("selStato").value === "Definitivo" ? "Provvisorio" : "Definitivo";
    mostraStato();
  };
  mostraStato();
  // la causale segue il giorno scelto finché non viene scritta a mano
  // Spostare una giornata salvata sposta TUTTE le sue vendite: si chiede, e mai in un altro anno (cambierebbe la giacenza di inizio anno)
  $("giorno").onchange = () => {
    const nuovoG = $("giorno").value;
    if (ven && ven.dbId && nuovoG && nuovoG !== ven.data) {
      if (nuovoG.slice(0, 4) !== ven.data.slice(0, 4)) { avviso(`La giornata è del ${ven.data.slice(0, 4)}: non si può spostare in un altro anno (cambierebbe la giacenza di inizio anno). Fai una giornata nuova.`, true); $("giorno").value = ven.data; return; }
      if (!confirm(`Spostare tutta la giornata dal ${giornoIt(ven.data)} al ${giornoIt(nuovoG)}? Tutte le sue vendite cambieranno giorno.\nSe vuoi solo registrare le vendite di un altro giorno, fai una giornata nuova.`)) { $("giorno").value = ven.data; return; }
    }
    if (/^(Riepilogo vendite giornaliere del |E-COMMERCE – vendite online del )/.test($("causale").value)) $("causale").value = causaleDi(nuovoG);
  };

  // ---------- Righe della giornata (prezzo = prezzo di vendita IVA inclusa; scarica la colonna Spedita) ----------
  let okGiornoVecchio = false;
  const righe = avviaRighe({
    // giornata di un giorno passato: prima di aggiungere un articolo si chiede se è stato venduto quel giorno (una volta sola)
    puoAggiungere: () => {
      if (!ven || !ven.dbId || $("giorno").value === oggi || okGiornoVecchio) return true;
      okGiornoVecchio = confirm(`Questa giornata è del ${giornoIt($("giorno").value)}.\nL'articolo è stato venduto quel giorno?\n\nOK = sì, aggiungilo qui · Annulla = no (le vendite di oggi vanno nella giornata di oggi)`);
      return okGiornoVecchio;
    },
    ...CFG_RIGHE,
    // sede estera: si vende senza IVA, quindi il prezzo è quello in etichetta tolta l'IVA
    prezzoDi: art => trovaSede(leggiSede()).estera ? Math.round(art.prezzo / (1 + (art.iva === 4 ? 4 : art.iva === 0 ? 0 : 22) / 100) * 100) / 100 : art.prezzo,
    sedeEstera: () => trovaSede(leggiSede()).estera,
    testoVuoto: () => ECOM ? "Spara o scrivi i codici degli articoli venduti online in questo giorno." : "Spara i barcode degli articoli venduti con la pistola, oppure usa il tasto ＋ e scrivi il codice.",
    cambiato: () => ricalcola()
  });

  // ---------- Totali in alto e riepilogo ----------
  const num = s => +String(s).replace(/\./g, "").replace(",", ".") || 0;
  function ricalcola() {
    const tot = righe.totale();
    const spese = [...document.querySelectorAll(".spesa")].reduce((s, i) => s + num(i.value), 0);
    $("impArticoli").value = numero(tot);
    $("totCompl").textContent = numero(tot + spese);
    $("topTotale").textContent = euro(tot);
    $("topPezzi").textContent = `${righe.pezzi()} pezzi · ${righe.RIGHE.length} righe`;
    $("nRigheTab").textContent = righe.RIGHE.length;
  }
  document.querySelectorAll(".spesa").forEach(i => i.oninput = ricalcola);

  // ---------- Pulsanti in alto ----------
  function controlla() {
    if (righe.senzaArticolo()) { avviso("C'è una riga senza articolo: scegli l'articolo o eliminala con il cestino"); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    if (!righe.RIGHE.length) { avviso("Aggiungi almeno un articolo venduto"); return false; }
    const oltre = righe.oltreGiacenza();
    if (oltre) { avviso(oltre + ": correggi la quantità prima di salvare", true); document.querySelector('.scheda-tab[data-t="articoli"]').click(); return false; }
    return true;
  }
  const annullato = ven && ven.stato === "Annullato";
  const pulsantiLettura = ["ddStampa", "btnExcel", "btnChiudi", "btnModifica"];
  let valoriPrima = [], righePrima = [];
  function modalita(modifica) {
    document.body.classList.toggle("in-modifica", modifica);
    document.querySelectorAll(".mod").forEach(el => el.disabled = !modifica);
    pulsantiLettura.forEach(id => $(id).hidden = modifica || (id === "btnModifica" && annullato));
    ["btnAnnulla", "btnSalva", "btnSalvaChiudi"].forEach(id => $(id).hidden = !modifica);
    $("bannerModifica").hidden = !modifica || nuovo;
    $("bannerVecchia").hidden = !modifica || !ven || !ven.dbId || ven.data === oggi;
    righe.disegna();
  }
  $("btnModifica").onclick = () => {
    valoriPrima = [...document.querySelectorAll(".mod")].map(el => el.value);
    righePrima = righe.fotografia();
    modalita(true);
  };
  $("btnAnnulla").onclick = () => {
    if (nuovo) {
      if (!righe.RIGHE.length || confirm("Uscire senza salvare la giornata?")) location.href = ELENCO_V;
      return;
    }
    document.querySelectorAll(".mod").forEach((el, i) => el.value = valoriPrima[i]);
    righe.ripristina(righePrima);
    mostraStato(); ricalcola(); modalita(false);
  };
  // Salvataggio nel database (giornata nuova o già salvata); poi si riapre la giornata o si torna all'elenco.
  // Le giornate di esempio non si salvano.
  async function salva(chiudi) {
    if (!controlla()) return;
    if (ven && !ven.dbId) { avviso("Questa è una giornata di esempio: le modifiche non si salvano"); modalita(false); return; }
    const db = await dbPronto;
    if (!db) { avviso("Per salvare serve l'accesso al database"); return; }
    const lista = righe.RIGHE.filter(r => r.sped > 0);
    if (lista.some(r => !r.articolo.id)) { avviso("Ci sono articoli di esempio: ricarica la pagina per usare quelli del database"); return; }
    const dati = {
      tipo: "vendite_giornaliere", stato: $("selStato").value, sede_id: ID_SEDI_DB[sedeLavoro],
      data_movimento: $("giorno").value || oggi, causale: $("causale").value.trim() || null, annotazioni: $("annotazioni").value.trim() || null,
      spese: Math.round([...document.querySelectorAll(".spesa")].reduce((s, i) => s + num(i.value), 0) * 100) / 100
    };
    // Di solito una giornata per giorno (negozio ed e-commerce separati). Se c'è già: si riapre quella,
    // oppure se ne fa un'altra ma con una nota che la distingue (obbligatoria)
    try {
      const doppia = await giornataDelGiornoDb(db, dati.data_movimento);
      if (doppia && !haNotaDistinta()) {
        const scelta = await chiediDoppione(doppia, dati.data_movimento, true);
        // Sì al salvataggio: i miei articoli si aggiungono alla giornata già creata (un solo giorno, anche con più colleghi)
        if (scelta === "unisci") {
          try { await unisciAllaGiornata(db, doppia.id, chiudi, { code: "GIORNATA_ESISTE" }); } catch (e) { avviso("Errore nel salvare: " + e.message, true); }
          return;
        }
        if (scelta !== "nuova") return;
        dati.causale = $("causale").value.trim() || null;
        dati.annotazioni = $("annotazioni").value.trim() || null;
      }
    } catch (err) { avviso("Errore nel controllare le giornate: " + err.message); return; }
    const pulsanti = ["btnSalva", "btnSalvaChiudi"].map($);
    pulsanti.forEach(b => b.disabled = true);
    try {
      // l'ora di ogni riga si salva solo se la colonna c'è (database/26-ora-righe.sql): si controlla PRIMA, perché salvando
      // le righe vecchie vengono sostituite e un errore a metà lascerebbe la giornata vuota
      const { error: senzaOra } = await db.from("movimenti_righe").select("aggiunto_il").limit(1);
      const id = await salvaMovimentoDb(db, dati, lista.map(r => ({ articolo_id: r.articolo.id, quantita: r.sped, prezzo: r.prezzo, sconto: r.sconto || 0,
        ...(senzaOra ? {} : { aggiunto_il: r.ora || null }) })), ven && ven.dbId);
      avviso(dati.stato === "Definitivo" ? `Giornata salvata: ${righe.pezzi()} pezzi scaricati dalla giacenza di ${sedeLavoro}`
        : "Giornata salvata come provvisoria: la giacenza non cambia finché non è definitiva");
      setTimeout(() => location.replace(chiudi ? ELENCO_V : `vendita.html?db=${id}`), 900);
    } catch (err) {
      // Due computer sulla stessa giornata (CONFLITTO) o due giornate di oggi create insieme (GIORNATA_ESISTE):
      // invece di perdere il lavoro, gli articoli aggiunti qui vanno nella giornata salvata dall'altro computer
      if (err.code === "CONFLITTO" || err.code === "GIORNATA_ESISTE") {
        try { await unisciAllaGiornata(db, err.code === "GIORNATA_ESISTE" ? err.idAltra : ven.dbId, chiudi, err); return; }
        catch (e2) { err = e2; }
      }
      avviso("Errore nel salvare la giornata: " + err.message, true);
      pulsanti.forEach(b => b.disabled = false);
    }
  }
  // Rilegge la giornata com'è ora nel database (con quello che ha salvato l'altro computer), ci aggiunge gli articoli
  // inseriti in questa pagina e la salva. Le modifiche fatte qui a righe che c'erano già (quantità, cancellazioni) non si riportano.
  async function unisciAllaGiornata(db, idGiornata, chiudi, motivo) {
    const altra = await leggiMovimentoDb(db, idGiornata, ID_SEDI_DB[sedeLavoro]);
    if (!altra) throw new Error(`Giornata #${idGiornata} non trovata`);
    // articoli aggiunti in questa pagina: le righe nuove, più i pezzi in più messi su righe che c'erano già (stesso articolo sparato di nuovo)
    const nuove = righe.RIGHE.filter(r => r.articolo && r.sped > 0 && !r.daDb).map(r => ({ r, quantita: r.sped }))
      .concat(righe.RIGHE.filter(r => r.articolo && r.daDb && r.sped > (r.qtaDb || 0)).map(r => ({ r, quantita: r.sped - (r.qtaDb || 0) })));
    const riga = r => ({ articolo_id: r.articolo_id, quantita: r.quantita, prezzo: r.prezzo, sconto: r.sconto, aggiunto_il: r.aggiunto_il });
    const tutte = altra.righe.map(r => riga({ articolo_id: r.articoli.id, quantita: +r.quantita, prezzo: +r.prezzo, sconto: +r.sconto || 0, aggiunto_il: r.aggiunto_il || null }))
      .concat(nuove.map(({ r, quantita }) => riga({ articolo_id: r.articolo.id, quantita, prezzo: r.prezzo, sconto: r.sconto || 0, aggiunto_il: r.ora || new Date().toISOString() })));
    const id = await salvaMovimentoDb(db, { tipo: altra.tipo, stato: altra.stato, sede_id: altra.sede_id, data_movimento: altra.data_movimento,
      causale: altra.causale, annotazioni: altra.annotazioni, spese: +altra.spese || 0 }, tutte, altra.id);
    avviso(`${motivo.code === "CONFLITTO" ? `Anche ${motivo.chi} stava lavorando su questa giornata` : "Un altro computer aveva appena creato la giornata"}: `
      + `ho aggiunto i tuoi ${nuove.length} articoli alla giornata #${id}${motivo.code === "CONFLITTO" ? " (controlla eventuali modifiche fatte a righe già salvate)" : ""}.`);
    setTimeout(() => location.replace(chiudi ? ELENCO_V : `vendita.html?db=${id}`), 2200);
  }
  $("btnSalva").onclick = () => salva(false);
  $("btnSalvaChiudi").onclick = () => salva(true);
  $("btnChiudi").onclick = () => location.href = ELENCO_V;
  $("btnExcel").onclick = () => righe.excel({ sede: sedeLavoro, tipo: ECOM ? "Vendite E-commerce" : "Vendite Giornaliere", numero: ven ? ven.id : null,
    riepilogo: [["Giorno", dataIt($("giorno").value || oggi)]], spese: [] });
  $("btnStampa").onclick = e => { e.stopPropagation(); $("menuStampa").classList.toggle("show"); };
  $("menuStampa").onclick = e => {
    const b = e.target.closest("button");
    if (b) avviso(`${b.dataset.az}: da definire insieme`);
    $("menuStampa").classList.remove("show");
  };
  document.addEventListener("click", () => $("menuStampa").classList.remove("show"));

  // Giornata salvata: se è definitiva i suoi pezzi sono già usciti dalla giacenza (giaScaricati, per il limite in modifica)
  // daDb: riga già salvata (serve a capire quali articoli sono stati aggiunti in questa pagina)
  if (movDb) righe.carica(movDb.righe.map(r => ({ qta: +r.quantita, prezzo: +r.prezzo, sconto: +r.sconto, articolo: r.articolo, ora: r.aggiunto_il || null, daDb: true, qtaDb: +r.quantita,
    giaScaricati: movDb.stato === "Definitivo" ? +r.quantita : 0 })));
  // Giornata di esempio: righe con articoli veri dell'anagrafica (il totale torna al centesimo)
  else if (ven) righe.carica(righeCarico(ven).map(r => ({ qta: r.qta, prezzo: r.prezzo, articolo: r.articolo, tot: r.tot, giaScaricati: ven.stato === "Definitivo" ? r.qta : 0 })));
  ricalcola();
  modalita(nuovo);
  // dalla lista e-commerce "Aggiungi alle vendite di oggi" (…&modifica=1): si apre già in modifica, pronta per la pistola
  if (!nuovo && ven && ven.dbId && ven.stato !== "Annullato" && qs.has("modifica")) {
    $("btnModifica").click();
    document.querySelector('.scheda-tab[data-t="articoli"]').click();
    righe.nuovaRiga();   // riga vuota pronta: si scrive il codice o si spara con la pistola
  }
  if (nuovo) { document.querySelector('.scheda-tab[data-t="articoli"]').click(); righe.nuovaRiga(); }

  // Giornata (del negozio o e-commerce, come questa) già salvata per quel giorno e non annullata: { id } o null
  async function giornataDelGiornoDb(db, giorno) {
    const { data, error } = await db.from("movimenti").select("id, stato, causale")
      .eq("tipo", "vendite_giornaliere").eq("sede_id", ID_SEDI_DB[sedeLavoro]).eq("data_movimento", giorno);
    if (error) throw error;
    // (la giornata che si sta guardando non conta)
    return (data || []).find(m => m.stato !== "Annullato" && m.id !== (ven && ven.dbId) && /^E-?COMMERCE/i.test(m.causale || "") === ECOM) || null;
  }
  // La giornata ha già la sua nota che la distingue (scritta nella finestra, o una giornata salvata con la causale cambiata)
  let notaDistinta = "";
  const haNotaDistinta = () => !!notaDistinta || !!(ven && ven.dbId && $("causale").value.trim() && $("causale").value.trim() !== causaleDi(ven.data));
  // Finestra "Vendite di oggi già create, vuoi riaprire quelle di oggi?": Sì = si apre quella già fatta;
  // No = si scrive la nota obbligatoria e si continua con questa. Restituisce "riapri", "nuova" o "annulla".
  function chiediDoppione(g, giorno, salvando) {
    const oggiS = giorno === oggi;
    // al salvataggio con articoli già inseriti, il Sì li aggiunge alla giornata esistente ("unisci") invece di perderli
    const unire = salvando && righe.RIGHE.some(r => r.articolo);
    $("doppiaTitolo").textContent = `${ECOM ? "Vendite e-commerce" : "Vendite giornaliere"} ${oggiS ? "di oggi" : "del " + giornoIt(giorno)} già create`;
    $("doppiaTesto").innerHTML = `Vuoi riaprire quelle ${oggiS ? "di oggi" : "del " + giornoIt(giorno)} (#${g.id}) e aggiungere lì gli articoli?`
      + (unire ? "<br><small>Se scegli Sì, gli articoli che hai inserito qui vengono aggiunti a quella giornata.</small>" : "");
    $("doppiaSi").textContent = unire ? "Sì, aggiungi i miei articoli a quella" : `Sì, riapri quelle ${oggiS ? "di oggi" : "del " + giornoIt(giorno)}`;
    $("doppiaNotaBox").hidden = true; $("doppiaCrea").hidden = true; $("doppiaSi").hidden = false; $("doppiaNo").textContent = "No";
    $("doppiaNota").value = "";
    $("finDoppia").style.display = "flex";
    return new Promise(fine => {
      const chiudi = v => { $("finDoppia").style.display = "none"; fine(v); };
      $("doppiaSi").onclick = () => { if (unire) { chiudi("unisci"); return; } ultimaUscitaOk(); location.href = `vendita.html?db=${g.id}&modifica=1`; chiudi("riapri"); };
      $("doppiaNo").onclick = () => {
        if (!$("doppiaNotaBox").hidden) { chiudi("annulla"); return; }   // secondo clic su "Annulla"
        $("doppiaNotaBox").hidden = false; $("doppiaCrea").hidden = false; $("doppiaSi").hidden = true; $("doppiaNo").textContent = "Annulla";
        $("doppiaNota").focus();
      };
      $("doppiaCrea").onclick = () => {
        const nota = $("doppiaNota").value.trim();
        if (!nota) { avviso("Scrivi una nota per distinguerla dall'altra giornata", true); $("doppiaNota").focus(); return; }
        notaDistinta = nota;
        // la nota va nella causale (si vede nell'elenco) e nelle annotazioni
        $("causale").value = `${causaleDi($("giorno").value || oggi)} – ${nota}`;
        $("annotazioni").value = [nota, $("annotazioni").value.trim()].filter(Boolean).join("\n");
        avviso("Nuova giornata separata: " + nota);
        chiudi("nuova");
      };
    });
  }
  // uscendo per riaprire l'altra giornata il browser non deve chiedere "vuoi uscire?"
  const ultimaUscitaOk = () => document.body.classList.remove("in-modifica");

  // Dopo l'accesso la ricerca articoli (e la pistola) usa gli articoli del database.
  // Giornata nuova: se quella di oggi c'è già lo si dice subito · giornata vecchia: il link porta a quella di oggi
  dbPronto.then(async db => {
    if (!db) return;
    if (nuovo || (ven && ven.dbId && ven.data !== oggi)) {
      const g = await giornataDelGiornoDb(db, oggi);
      // giornata nuova ma quella di oggi c'è già: si chiede subito se riaprire quella
      if (nuovo && g && await chiediDoppione(g, oggi, false) === "annulla") location.href = ELENCO_V;
      if (g) $("linkOggi").href = `vendita.html?db=${g.id}`;
    }
    await caricaArticoliDalDb(db, ID_SEDI_DB[sedeLavoro]);
  }).catch(err => avviso("Errore nel leggere gli articoli: " + err.message));
  // Inventario in corso in questa sede: avviso in alto (non fare vendite né scarichi)
  dbPronto.then(db => avvisaInventarioInCorso(db, ID_SEDI_DB[trovaSede(leggiSede()).nome])).catch(() => {});
</script>
